<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 347 Top K Frequent | Code Dry Run</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');*{box-sizing:border-box}:root{--bg:#07111d;--s:#0c1a2a;--line:#25435b;--ink:#e8f1f7;--muted:#9cb5c9;--blue:#5eb5ff;--cyan:#5eead4;--amber:#fbbf24;--lime:#a3e635}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}main{max-width:1180px;margin:auto;padding:22px}.eye{font:700 10px 'IBM Plex Mono',monospace;color:var(--cyan);letter-spacing:.08em}h1{margin:7px 0}p{color:var(--muted)}.ops{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.op{font:12px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:4px;padding:5px 7px;color:var(--muted)}.op.active{background:var(--amber);border-color:var(--amber);color:#07111d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:15px}.panel h2{font-size:.85rem;color:var(--cyan);margin:0 0 10px}.state,.code{font:13px/1.65 'IBM Plex Mono',monospace;white-space:pre-wrap;min-height:125px}.code{max-height:365px;overflow:auto;color:#b7cede}.code div{padding:0 7px;border-left:3px solid transparent}.code .active{background:#173955;border-left-color:var(--amber);color:#fff}.note{margin-top:12px;background:#092033;border-left:3px solid var(--cyan);padding:12px;line-height:1.55}.why{margin-top:10px;background:#102311;border-left:3px solid var(--lime);padding:11px;color:#d9f99d}.btn{margin:14px 6px 0 0;background:#10253a;border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:5px;cursor:pointer}.meter{float:right;margin-top:22px;color:var(--muted);font:12px 'IBM Plex Mono',monospace}@media(max-width:720px){main{padding:15px}.grid{grid-template-columns:1fr}}</style></head><body><main><div class="eye">LC 347 | VISUAL CODE DRY RUN</div><h1>Top K Frequent Elements</h1><p>Input: <code>nums = [1,1,1,2,2,3], k = 2</code>. We count first, then use frequency as a bucket index.</p><div class="ops" id="ops"></div><div class="grid"><section class="panel"><h2>Live state</h2><div class="state" id="state"></div></section><section class="panel"><h2>Full Java method: active line executes now</h2><div class="code" id="code"></div></section></div><div class="grid" style="margin-top:14px"><section class="panel"><h2>What changed?</h2><div class="note" id="note"></div><div class="why" id="why"></div></section><section class="panel"><h2>Return value</h2><div class="state" id="result"></div></section></div><button class="btn" id="play">Pause</button><button class="btn" id="previous">Previous</button><button class="btn" id="next">Next</button><button class="btn" id="reset">Reset</button><span class="meter" id="meter"></span></main><script>const codeLines=['public int[] topKFrequent(int[] nums, int k) {','  Map<Integer, Integer> freqMap = new HashMap<>();','  for (int num : nums) {','    freqMap.put(num, freqMap.getOrDefault(num, 0) + 1);','  }','  List<Integer>[] bucket = new List[nums.length + 1];','  for (int num : freqMap.keySet()) {','    int freq = freqMap.get(num);','    if (bucket[freq] == null) bucket[freq] = new ArrayList<>();','    bucket[freq].add(num);','  }','  int[] result = new int[k];','  int index = 0;','  for (int i = bucket.length - 1; i >= 0 && index < k; i--) {','    if (bucket[i] != null) {','      for (int num : bucket[i]) {','        result[index++] = num;','        if (index == k) return result;','      }','    }','  }','  return result;','}'];const steps=[{op:'1. create freqMap',line:1,state:'nums: [1,1,1,2,2,3]\nfreqMap: {}\nbuckets: empty\nresult: [_, _], index=0',note:'Create an empty frequency map.',why:'We need count data before knowing which values are most frequent.'},{op:'2. read first 1',line:3,state:'active num: 1\nfreqMap: {1=1}\nbuckets: empty\nresult: [_, _], index=0',note:'getOrDefault(1,0)+1 becomes 1.',why:'Map stores each distinct value once with its count.'},{op:'3. count all numbers',line:3,state:'active nums: 1,1,2,2,3\nfreqMap: {1=3, 2=2, 3=1}\nbuckets: empty\nresult: [_, _], index=0',note:'Finish the first loop. Frequencies are 3, 2, and 1.',why:'Frequency can never exceed nums.length, so it can be an array index.'},{op:'4. create bucket array',line:5,state:'freqMap: {1=3, 2=2, 3=1}\nbucket[0..6]: [_, _, _, _, _, _, _]\nresult: [_, _], index=0',note:'Allocate 7 buckets because max frequency is 6.',why:'bucket[f] will hold every number that appears f times.'},{op:'5. place 1 in bucket[3]',line:9,state:'freqMap: {1=3, 2=2, 3=1}\nbuckets: 1:[3]  2:[]  3:[1]\nresult: [_, _], index=0',note:'Frequency of 1 is 3, so add 1 to bucket 3.',why:'The bucket position is the frequency, not the original array index.'},{op:'6. place 2 in bucket[2]',line:9,state:'buckets: 1:[3]  2:[2]  3:[1]\nresult: [_, _], index=0',note:'Frequency of 2 is 2, so add 2 to bucket 2.',why:'Equal-frequency values would share one bucket.'},{op:'7. place 3 in bucket[1]',line:9,state:'buckets: 1:[3]  2:[2]  3:[1]\nresult: [_, _], index=0',note:'Frequency of 3 is 1.',why:'The bucket model is now complete.'},{op:'8. start from highest bucket',line:13,state:'i=6 -> 4: empty\ni=3: [1]\nresult: [_, _], index=0',note:'Scan backward from frequency 6. Empty buckets are skipped.',why:'Higher frequency appears first, so no sort of distinct values is needed.'},{op:'9. result[index++] = 1',line:16,state:'i=3, bucket[3]=[1]\nresult: [1, _], index=1',note:'Take 1 from the highest non-empty bucket.',why:'1 is guaranteed to be one of the most frequent values.'},{op:'10. result[index++] = 2',line:16,state:'i=2, bucket[2]=[2]\nresult: [1, 2], index=2',note:'Move to bucket 2 and take 2.',why:'We need exactly k=2 values.'},{op:'11. return result',line:17,state:'result: [1, 2]\nindex == k is true',note:'The early return runs when the result has k values.',why:'Lower-frequency buckets cannot affect top k.'}];const code=document.querySelector('#code'),ops=document.querySelector('#ops'),state=document.querySelector('#state'),note=document.querySelector('#note'),why=document.querySelector('#why'),result=document.querySelector('#result'),meter=document.querySelector('#meter');codeLines.forEach((line,i)=>{const row=document.createElement('div');row.textContent=`${i+1}. ${line}`;code.append(row)});steps.forEach(step=>{const item=document.createElement('span');item.className='op';item.textContent=step.op;ops.append(item)});let index=0,running=false,timer;function render(){const step=steps[index];[...ops.children].forEach((item,i)=>item.classList.toggle('active',i===index));[...code.children].forEach((row,i)=>row.classList.toggle('active',i===step.line));code.children[step.line].scrollIntoView({block:'nearest'});state.textContent=step.state;note.textContent=step.note;why.innerHTML='<strong>Why:</strong> '+step.why;result.textContent=index===steps.length-1?'topKFrequent([1,1,1,2,2,3], 2) = [1,2]':'Result is filled from highest frequency down.';meter.textContent=`${index+1} / ${steps.length}`}function schedule(){clearInterval(timer);if(running)timer=setInterval(()=>{index=(index+1)%steps.length;render()},4200);document.querySelector('#play').textContent=running?'Pause':'Play'}document.querySelector('#play').onclick=()=>{running=!running;schedule()};document.querySelector('#next').onclick=()=>{running=false;schedule();index=Math.min(index+1,steps.length-1);render()};document.querySelector('#previous').onclick=()=>{running=false;schedule();index=Math.max(index-1,0);render()};document.querySelector('#reset').onclick=()=>{running=false;schedule();index=0;render()};render();</script></body></html>
