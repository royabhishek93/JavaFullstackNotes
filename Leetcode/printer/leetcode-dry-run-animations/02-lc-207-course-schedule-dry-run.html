<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 207 Course Schedule | Code Dry Run</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');*{box-sizing:border-box}:root{--bg:#07111d;--s:#0c1a2a;--line:#25435b;--ink:#e8f1f7;--muted:#9cb5c9;--blue:#5eb5ff;--cyan:#5eead4;--amber:#fbbf24;--lime:#a3e635}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}main{max-width:1180px;margin:auto;padding:22px}.eye{font:700 10px 'IBM Plex Mono',monospace;color:var(--cyan);letter-spacing:.08em}h1{margin:7px 0}p{color:var(--muted)}.ops{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.op{font:12px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:4px;padding:5px 7px;color:var(--muted)}.op.active{background:var(--amber);border-color:var(--amber);color:#07111d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:15px}.panel h2{font-size:.85rem;color:var(--cyan);margin:0 0 10px}.state,.code{font:13px/1.65 'IBM Plex Mono',monospace;white-space:pre-wrap;min-height:125px}.code{max-height:365px;overflow:auto;color:#b7cede}.code div{padding:0 7px;border-left:3px solid transparent}.code .active{background:#173955;border-left-color:var(--amber);color:#fff}.note{margin-top:12px;background:#092033;border-left:3px solid var(--cyan);padding:12px;line-height:1.55}.why{margin-top:10px;background:#102311;border-left:3px solid var(--lime);padding:11px;color:#d9f99d}.btn{margin:14px 6px 0 0;background:#10253a;border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:5px;cursor:pointer}.meter{float:right;margin-top:22px;color:var(--muted);font:12px 'IBM Plex Mono',monospace}@media(max-width:720px){main{padding:15px}.grid{grid-template-columns:1fr}}</style></head>
<body><main><div class="eye">LC 207 | VISUAL CODE DRY RUN</div><h1>Course Schedule</h1><p>Input: <code>numCourses = 2, prerequisites = [[1,0]]</code>. Course 0 must finish before course 1.</p><div class="ops" id="ops"></div><div class="grid"><section class="panel"><h2>Graph, indegree, and queue</h2><div class="state" id="state"></div></section><section class="panel"><h2>Full Java method: active line executes now</h2><div class="code" id="code"></div></section></div><div class="grid" style="margin-top:14px"><section class="panel"><h2>What changed?</h2><div class="note" id="note"></div><div class="why" id="why"></div></section><section class="panel"><h2>Return value</h2><div class="state" id="result"></div></section></div><button class="btn primary" id="play">Pause</button><button class="btn" id="previous">Previous</button><button class="btn" id="next">Next</button><button class="btn" id="reset">Reset</button><span class="meter" id="meter"></span></main><script>
const codeLines=['public boolean canFinish(int numCourses, int[][] prerequisites) {','  List<List<Integer>> graph = new ArrayList<>();','  int[] indegree = new int[numCourses];','  for (int i = 0; i < numCourses; i++) graph.add(new ArrayList<>());','  for (int[] prereq : prerequisites) {','    graph.get(prereq[1]).add(prereq[0]);','    indegree[prereq[0]]++;','  }','  Queue<Integer> queue = new LinkedList<>();','  for (int i = 0; i < numCourses; i++) {','    if (indegree[i] == 0) queue.offer(i);','  }','  int completed = 0;','  while (!queue.isEmpty()) {','    int course = queue.poll();','    completed++;','    for (int next : graph.get(course)) {','      if (--indegree[next] == 0) queue.offer(next);','    }','  }','  return completed == numCourses;','}'];
const steps=[
 {op:'1. create graph',line:1,state:'graph = [ [], [] ]\nindegree = [0, 0]\nqueue = []\ncompleted = 0',note:'Create storage for prerequisites and each course count.',why:'indegree[i] means how many courses must finish before i.'},
 {op:'2. add edge 0 -> 1',line:5,state:'graph = [ [1], [] ]\nindegree = [0, 0]\nqueue = []\ncompleted = 0',note:'For [1,0], add 1 to graph[0].',why:'The directed edge means course 0 unlocks course 1.'},
 {op:'3. indegree[1]++',line:6,state:'graph = [ [1], [] ]\nindegree = [0, 1]\nqueue = []\ncompleted = 0',note:'Course 1 now has one unfinished prerequisite.',why:'Only an indegree-zero course can enter the queue.'},
 {op:'4. queue.offer(0)',line:10,state:'graph = [ [1], [] ]\nindegree = [0, 1]\nqueue = [0]\ncompleted = 0',note:'Course 0 has no prerequisites, so it is ready.',why:'Queue invariant: every queued course has indegree 0.'},
 {op:'5. course = queue.poll()',line:14,state:'graph = [ [1], [] ]\nindegree = [0, 1]\nqueue = []\ncourse = 0\ncompleted = 0',note:'Take course 0 from the queue.',why:'We process one currently valid course.'},
 {op:'6. completed++',line:15,state:'graph = [ [1], [] ]\nindegree = [0, 1]\nqueue = []\ncourse = 0\ncompleted = 1',note:'Course 0 is complete.',why:'The final count detects a cycle.'},
 {op:'7. --indegree[1]',line:17,state:'graph = [ [1], [] ]\nindegree = [0, 0]\nqueue = []\ncourse = 0\ncompleted = 1',note:'Course 0 unlocks course 1. Decrement 1 from 1 to 0.',why:'The last completed prerequisite makes a course ready.'},
 {op:'8. queue.offer(1)',line:17,state:'graph = [ [1], [] ]\nindegree = [0, 0]\nqueue = [1]\ncompleted = 1',note:'Because indegree[1] is now zero, put course 1 in the queue.',why:'Newly unlocked work is queued exactly once.'},
 {op:'9. course = queue.poll()',line:14,state:'graph = [ [1], [] ]\nindegree = [0, 0]\nqueue = []\ncourse = 1\ncompleted = 1',note:'Take the last ready course, 1.',why:'It has no outgoing dependency to unlock.'},
 {op:'10. completed++',line:15,state:'graph = [ [1], [] ]\nindegree = [0, 0]\nqueue = []\ncompleted = 2',note:'Course 1 is complete.',why:'All courses were processed.'},
 {op:'11. return completed == numCourses',line:20,state:'completed = 2\nnumCourses = 2\n2 == 2 is true',note:'Return true.',why:'A cycle would leave some course with indegree above zero and completed would be less than numCourses.'}
];
const code=document.querySelector('#code'),ops=document.querySelector('#ops'),state=document.querySelector('#state'),note=document.querySelector('#note'),why=document.querySelector('#why'),result=document.querySelector('#result'),meter=document.querySelector('#meter');codeLines.forEach((line,i)=>{const row=document.createElement('div');row.textContent=`${i+1}. ${line}`;code.append(row)});steps.forEach(step=>{const item=document.createElement('span');item.className='op';item.textContent=step.op;ops.append(item)});let index=0;function render(){const step=steps[index];[...ops.children].forEach((item,i)=>item.classList.toggle('active',i===index));[...code.children].forEach((row,i)=>row.classList.toggle('active',i===step.line));code.children[step.line].scrollIntoView({block:'nearest'});state.textContent=step.state;note.textContent=step.note;why.innerHTML='<strong>Why:</strong> '+step.why;result.textContent=index===steps.length-1?'canFinish(2, [[1,0]]) = true':'Result is decided at final return.';meter.textContent=`${index+1} / ${steps.length}`}document.querySelector('#next').onclick=()=>{index=Math.min(index+1,steps.length-1);render();if(timer)resetAuto()};document.querySelector('#previous').onclick=()=>{index=Math.max(index-1,0);render();if(timer)resetAuto()};document.querySelector('#reset').onclick=()=>{index=0;render()};let timer=setInterval(advance,2200);function advance(){if(index<steps.length-1){index++;render();}else{clearInterval(timer);timer=null;document.querySelector('#play').textContent='▶ Play';}}function resetAuto(){clearInterval(timer);timer=setInterval(advance,2200);}document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='▶ Play';}else{timer=setInterval(advance,2200);document.querySelector('#play').textContent='Pause';}};render();</script></body></html>
