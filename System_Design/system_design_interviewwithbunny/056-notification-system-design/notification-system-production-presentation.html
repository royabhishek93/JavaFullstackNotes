<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notification System Production Design</title><style>
:root{--ink:#172b4d;--muted:#5e7188;--bg:#f5f7f8;--line:#d5dee7;--blue:#1769aa;--teal:#008c78;--orange:#d57b16;--red:#ca4d4a;--bp:#e8f3fb;--tp:#e3f6f1;--op:#fff3e4;--rp:#fcedea}*{box-sizing:border-box}body{align-items:center;background:var(--bg);color:var(--ink);display:flex;font-family:Arial,sans-serif;height:100vh;justify-content:center;margin:0;overflow:hidden}main{background:#fff;box-shadow:0 12px 35px rgba(23,43,77,.08);display:grid;grid-template-rows:auto 1fr auto;height:720px;padding:36px 54px 28px;position:relative;width:1280px}main:before{background-image:linear-gradient(rgba(23,43,77,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(23,43,77,.025) 1px,transparent 1px);background-size:36px 36px;content:"";inset:0;position:absolute}header,section,footer{position:relative;z-index:1}header{align-items:flex-start;display:flex;justify-content:space-between}.eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:1.7px;margin:0 0 8px;text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:30px;margin:0}.time{color:var(--muted);font-size:14px;font-weight:700;padding-top:6px}.content{align-items:center;display:grid;gap:40px;grid-template-columns:.86fr 1.14fr;padding:18px 10px 10px}.label{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:1.4px;margin:0 0 12px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:0 0 18px}.lead{color:var(--muted);font-size:18px;line-height:1.48;margin:0}.notes{display:grid;gap:11px;margin-top:23px}.note{border-left:4px solid var(--teal);font-size:14px;line-height:1.35;padding:7px 0 7px 12px}.note:nth-child(2){border-color:var(--orange)}.note:nth-child(3){border-color:var(--red)}.canvas{background:#fcfdfd;border:1px solid var(--line);height:385px;overflow:hidden;padding:24px;position:relative}.stack{display:grid;gap:14px;height:100%;place-content:center;width:100%}.row{align-items:center;display:flex;gap:12px;justify-content:center}.node{background:#fff;border:2px solid var(--blue);box-shadow:0 4px 10px rgba(23,43,77,.07);font-size:13px;font-weight:700;min-width:105px;padding:15px 12px;text-align:center}.node small{color:var(--muted);display:block;font-size:10px;font-weight:400;line-height:1.3;margin-top:6px}.teal{background:var(--tp);border-color:var(--teal)}.orange{background:var(--op);border-color:var(--orange)}.red{background:var(--rp);border-color:var(--red)}.arrow{color:var(--blue);font-size:30px}.caption{color:var(--muted);font-size:11px;font-weight:700;text-align:center;text-transform:uppercase}.db{background:var(--bp);border:2px solid var(--blue);font:12px/1.5 Menlo,monospace;padding:15px;width:100%}.topic{background:var(--tp);border:2px solid var(--teal);font:12px/1.4 Menlo,monospace;padding:12px;width:100%}.code{background:#172b4d;color:#eff7ff;font:13px/1.65 Menlo,monospace;padding:18px;width:100%}.code b{color:#8ce6d4}.code i{color:#ffd78d;font-style:normal}.class{border:2px solid var(--blue);min-width:170px;padding:12px;text-align:left}.class b{color:var(--blue);display:block;font-size:14px;margin-bottom:7px}.class span{color:var(--muted);display:block;font:11px/1.45 Menlo,monospace}.metric{background:#fff;border:1px solid var(--line);min-width:130px;padding:16px;text-align:center}.metric b{color:var(--blue);display:block;font-size:26px}.metric span{color:var(--muted);font-size:11px}.decision{background:var(--bp);border:2px solid var(--blue);font-size:15px;font-weight:700;padding:15px;text-align:center;width:210px}.decision.yes{background:var(--tp);border-color:var(--teal)}.decision.no{background:var(--rp);border-color:var(--red)}footer{align-items:center;border-top:1px solid var(--line);display:flex;gap:14px;padding-top:17px}.track{background:#e8ecec;flex:1;height:5px}.track span{background:var(--red);display:block;height:100%}.foot{color:var(--muted);font-size:12px;font-weight:700;min-width:190px;text-align:right}
</style></head><body><main><header><div><p class="eyebrow">Production System Design</p><p class="brand">Notification System</p></div><p class="time" id="time"></p></header><section class="content"><div><p class="label" id="section"></p><h1 id="title"></h1><p class="lead" id="lead"></p><div class="notes" id="notes"></div></div><div class="canvas" id="canvas"></div></section><footer><div class="track"><span id="progress"></span></div><div class="foot" id="foot"></div></footer></main><script>
const n=(name,detail='',tone='')=>`<div class="node ${tone}">${name}<small>${detail}</small></div>`;
const slides=[
['1. User problem','Send the right notification through the right channel, without losing it.','A notification system sends email, SMS, push, and in-app messages. It must deliver an OTP quickly, respect user preferences, handle huge campaigns, track what happened, and survive provider failures.',['Critical notifications cannot wait behind marketing.','A failed provider call must be retried safely.','Users decide which channels they accept.'],`<div class="stack"><div class="row">${n('Your App','order, OTP, alert','orange')}<div class="arrow">-></div>${n('Notification System','decide + deliver','blue')}<div class="arrow">-></div>${n('User','email, SMS, push','teal')}</div><div class="caption">One system, many delivery channels</div></div>`,'Notification fundamentals'],
['2. Channels and priority','Not every message deserves the same speed.','An OTP is urgent because the user is waiting at login. An order confirmation is important but can take seconds. Marketing can wait much longer. Separate priority lanes stop low-value bulk work from delaying urgent messages.',['Critical: OTP and security alerts.','Standard: order and delivery updates.','Promotional: campaigns and newsletters.'],`<div class="stack"><div class="row">${n('OTP','under 10 seconds','red')} ${n('Order update','5 to 10 seconds','orange')} ${n('Campaign','minutes are fine','teal')}</div><div class="row"><div class="arrow">v</div><div class="arrow">v</div><div class="arrow">v</div></div><div class="row">${n('Critical topic','many workers','red')} ${n('Standard topic','normal workers','orange')} ${n('Bulk topic','few workers','teal')}</div></div>`,'Priority lanes'],
['3. HLD: complete system','HLD shows the major production components.','Applications call the API Gateway. Notification Service validates requests, templates, and preferences. It writes durable data, publishes work to Kafka, and delivery workers call email, SMS, push, or in-app providers.',['Postgres stores durable notifications and outbox rows.','Kafka carries asynchronous delivery work.','Provider webhooks update final delivery status.'],`<div class="stack"><div class="row">${n('Applications','Amazon, bank, food app','orange')}<div class="arrow">-></div>${n('API Gateway','auth + rate limit','blue')}<div class="arrow">-></div>${n('Notification Service','validate + save','blue')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${n('Postgres + Outbox','durable record','teal')}<div class="arrow">-></div>${n('Kafka','priority topics','teal')}<div class="arrow">-></div>${n('Workers','send channel','blue')}</div><div class="row">${n('Email','SendGrid / SES','orange')}${n('SMS','Twilio','orange')}${n('Push','FCM / APNs','orange')}</div></div>`,'HLD component diagram'],
['4. Template and preferences','Build the message only after checking user choices.','Templates keep notification text consistent. Variables fill in names, order IDs, and amounts. Preferences decide whether a user accepts this channel and this notification type. The system must skip a promotional message when the user opted out.',['Template versions are immutable.','Preferences are cached in Redis.','Transactional and alert rules may override promotional choices by policy.'],`<div class="stack"><div class="db">TEMPLATE\nHi {{name}}, order {{order_id}} is confirmed.</div><div class="row"><div class="arrow">+</div></div><div class="row">${n('Variables','Alice + ORD-42','orange')}<div class="arrow">-></div>${n('Rendered message','ready to deliver','blue')}</div><div class="row">${n('Preferences','email yes, SMS no','teal')}<div class="arrow">-></div><div class="decision yes">send email\nskip SMS</div></div></div>`,'Content and consent'],
['5. LLD: request acceptance','Accept the request once and make it durable.','At code level, NotificationController receives the API call. NotificationService validates template and preferences, creates a notification record, and creates an outbox event in the same database transaction.',['Status begins as PENDING or SCHEDULED.','Client idempotency key makes retries safe.','One transaction means both records exist or neither exists.'],`<div class="stack"><div class="row"><div class="class"><b>NotificationController</b><span>POST /notifications</span></div><div class="arrow">-></div><div class="class"><b>NotificationService</b><span>validate + render</span></div></div><div class="row"><div class="arrow">v</div></div><div class="row"><div class="class"><b>NotificationRepository</b><span>INSERT PENDING</span></div><div class="arrow">+</div><div class="class"><b>OutboxRepository</b><span>INSERT unpublished</span></div></div></div>`,'LLD write path'],
['6. Outbox Pattern','Never lose a notification between database and queue.','Without an outbox, the service might save a notification in Postgres and crash before it publishes to Kafka. The user would never receive it. The outbox stores the future Kafka event in the same transaction as the notification.',['Commit writes notification and outbox together.','Publisher finds unpublished outbox records.','Kafka failure leaves the record available for retry.'],`<div class="stack"><div class="row">${n('One DB transaction','commit together','blue')}</div><div class="row">${n('notifications','PENDING','teal')}<div class="arrow">+</div>${n('notifications_outbox','published=false','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${n('Outbox Publisher','poll / CDC','orange')}<div class="arrow">-></div>${n('Kafka','event published','teal')}</div></div>`,'Reliable event publishing'],
['7. Kafka topic design','Use queues as separate waiting rooms.','Kafka decouples request acceptance from provider delivery. Each priority and channel can use a separate topic, allowing workers to scale independently. OTP workers continue processing even when a marketing campaign creates a large backlog.',['Critical SMS topic for OTP and security.','Standard topics for routine transactions.','Retry and DLQ topics isolate failure work.'],`<div class="stack"><div class="topic">notifications.critical.sms  -> OTP and security alerts</div><div class="topic">notifications.standard.email -> order confirmations</div><div class="topic">notifications.promotional.push -> campaigns</div><div class="topic">notifications.retry -> delayed retry | notifications.dlq -> manual review</div></div>`,'Kafka priority topics'],
['8. Worker delivery path','Workers safely call external providers.','A delivery worker reads a Kafka event, checks whether this notification was already sent, checks provider rate limits, and then calls the selected provider. The worker records provider message ID and current status.',['Idempotency prevents duplicate sends after Kafka retry.','Token Bucket protects provider quotas.','Provider failover can switch SendGrid to SES.'],`<div class="stack"><div class="row">${n('Kafka Worker','consume event','blue')}<div class="arrow">-></div>${n('Idempotency','already sent?','teal')}<div class="arrow">-></div>${n('Rate Limit','provider quota','orange')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${n('Provider Adapter','select channel','blue')}<div class="arrow">-></div>${n('SendGrid / Twilio / FCM','external API','orange')}</div></div>`,'Consumer processing'],
['9. Provider callbacks','Sent is not the same as delivered.','After a provider accepts a request, it may later send a webhook reporting delivery, bounce, open, click, or permanent failure. Webhook handlers update DeliveryStatus using the provider message ID.',['SENT: provider accepted request.','DELIVERED: device or mailbox accepted it.','BOUNCED: permanent email failure; do not retry.'],`<div class="stack"><div class="row">${n('Provider','SendGrid, Twilio, FCM','orange')}<div class="arrow">-></div>${n('Webhook API','verify signature','blue')}<div class="arrow">-></div>${n('DeliveryStatus','update state','teal')}</div><div class="row">${n('PENDING','waiting','')}<div class="arrow">-></div>${n('SENT','accepted','blue')}<div class="arrow">-></div>${n('DELIVERED','confirmed','teal')}</div></div>`,'Delivery tracking'],
['10. Retry and DLQ','Retry temporary failures, not permanent ones.','Network timeout and provider overload can recover, so use exponential backoff. Invalid phone number and hard email bounce will not recover, so mark them failed. After retry attempts are exhausted, send the event to a dead-letter queue for operations review.',['Retry: 1 minute, 5 minutes, then 15 minutes.','Use a different topic for delayed retry.','DLQ helps operators inspect poison messages.'],`<div class="stack"><div class="row">${n('Temporary failure','timeout','orange')}<div class="arrow">-></div>${n('Retry topic','backoff delay','blue')}<div class="arrow">-></div>${n('Try again','provider call','teal')}</div><div class="row">${n('Retry exhausted','3 attempts','red')}<div class="arrow">-></div>${n('DLQ','alert + inspect','red')}</div></div>`,'Failure handling'],
['11. OTP fast path','Treat security codes as a special product requirement.','OTP requests should use the critical SMS topic, a strict provider rate limit, short Redis TTL, and faster workers. The system stores a hashed code in Redis so verification is fast and the code disappears automatically.',['OTP should not wait behind regular messages.','Expire code in about 5 minutes.','Rate limit sends to prevent abuse and cost spikes.'],`<div class="stack"><div class="row">${n('Login request','need OTP','orange')}<div class="arrow">-></div>${n('OTP Service','create hash + TTL','blue')}<div class="arrow">-></div>${n('Redis','OTP hash | 5 min','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${n('Kafka critical.sms','priority lane','red')}<div class="arrow">-></div>${n('SMS Provider','fast delivery','orange')}</div></div>`,'Critical notification path'],
['12. LLD: provider adapters','Hide provider differences behind one interface.','Email, SMS, and push providers use different APIs and error formats. A ChannelProvider interface lets the worker call send in one standard way. EmailProvider, SmsProvider, and PushProvider translate that call to SendGrid, Twilio, or FCM.',['Workers depend on an interface, not provider SDKs.','Failover chooses a backup implementation.','Testing uses a fake provider implementation.'],`<div class="stack"><div class="row"><div class="class"><b>ChannelProvider</b><span>+ send(request)</span></div></div><div class="row"><div class="arrow">v</div><div class="arrow">v</div><div class="arrow">v</div></div><div class="row"><div class="class"><b>EmailProvider</b><span>SendGrid / SES</span></div><div class="class"><b>SmsProvider</b><span>Twilio / MSG91</span></div><div class="class"><b>PushProvider</b><span>FCM / APNs</span></div></div></div>`,'LLD provider design'],
['13. Scheduled and bulk sends','Scheduling changes when work enters Kafka.','A scheduled notification is saved with a future timestamp. A scheduler finds records that are due and puts them into the correct Kafka priority topic. Bulk campaigns are split into batches, rate limited, and processed with low priority.',['Do not put millions of future messages directly in a queue.','Use indexes on scheduled time and status.','Batch campaigns to avoid provider overload.'],`<div class="stack"><div class="row">${n('Scheduled notification','send at 09:00','orange')}<div class="arrow">-></div>${n('Postgres','SCHEDULED','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${n('Scheduler','find due records','blue')}<div class="arrow">-></div>${n('Kafka bulk topic','batched work','teal')}<div class="arrow">-></div>${n('Workers','rate limited','orange')}</div></div>`,'Scheduling and campaigns'],
['14. Preferences and quiet hours','Respect consent before creating delivery work.','User preferences can disable a channel, a notification type, or all non-critical messages during do-not-disturb hours. Cache preferences in Redis because every notification request needs a quick answer.',['Promotional opt-out must be honored.','Transactional policy can be different.','Preference changes publish cache invalidation events.'],`<div class="stack"><div class="db">USER PREFERENCES\nemail: yes | SMS: no | push: yes\npromotional: no | transactional: yes\ndo not disturb: 22:00 - 07:00</div><div class="row">${n('Marketing push','check preferences','orange')}<div class="arrow">-></div><div class="decision no">SKIP\nuser opted out</div></div></div>`,'Consent enforcement'],
['15. Observability','Monitor delivery as a business workflow.','A notification system is healthy only when users receive important messages. Measure request rate, Kafka lag, provider latency, retry count, delivery rate, bounce rate, and dead-letter volume.',['Kafka lag shows workers are behind.','Provider errors reveal external outage or bad data.','Delivery funnel shows where users lose messages.'],`<div class="nodes" style="align-items:center;display:flex;gap:10px;height:100%;justify-content:center"><div class="metric"><b>1M/min</b><span>request rate</span></div><div class="metric"><b>p99</b><span>delivery latency</span></div><div class="metric"><b>0</b><span>DLQ target</span></div><div class="metric"><b>99%</b><span>delivery rate</span></div></div>`,'Production observability'],
['16. Capacity planning','Scale each layer for its own workload.','API and Notification Service scale with incoming requests. Kafka scales with partitions and consumers. Delivery workers scale by channel and provider limit. Postgres scales durable write capacity. Redis scales cache, OTP, and rate-limit workload.',['Separate critical and bulk capacity.','Keep provider quotas in the scaling calculation.','Load test campaigns and provider failover.'],`<div class="stack"><div class="row">${n('API Fleet','request load','blue')}<div class="arrow">+</div>${n('Kafka','queue throughput','teal')}<div class="arrow">+</div>${n('Workers','provider limits','orange')}</div><div class="row">${n('Postgres','durable writes','blue')}<div class="arrow">+</div>${n('Redis','cache + OTP + quota','teal')}<div class="arrow">+</div>${n('Providers','external capacity','orange')}</div></div>`,'Scaling model'],
['17. Final production design','Make delivery reliable, asynchronous, and observable.','Accept a request once, validate content and consent, save notification plus outbox atomically, publish to priority Kafka topics, deliver with idempotent workers, and track provider outcomes. HLD explains the big flow; LLD keeps the implementation clean.',['Outbox protects against DB-to-Kafka loss.','Priority topics protect OTP from campaigns.','Retries, DLQ, and metrics make failures manageable.'],`<div class="stack"><div class="row">${n('Notification + Outbox','durable accept','teal')}<div class="arrow">-></div>${n('Kafka priority topic','async buffer','blue')}<div class="arrow">-></div>${n('Idempotent worker','safe provider call','orange')}</div><div class="row"><div class="decision yes">Reliable multi-channel notification delivery</div></div></div>`,'Production checklist']
];const duration=300,requested=new URLSearchParams(location.search).get('time'),fixed=requested===null?null:Math.max(0,Math.min(duration-.01,Number(requested))),$=id=>document.getElementById(id);function render(t){const i=Math.min(slides.length-1,Math.floor(t/(duration/slides.length))),s=slides[i];$('time').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')} / 05:00`;$('section').textContent=`Chapter ${i+1} of ${slides.length}`;$('title').textContent=s[1];$('lead').textContent=s[2];$('notes').innerHTML=s[3].map(x=>`<div class="note">${x}</div>`).join('');$('canvas').innerHTML=s[4];$('foot').textContent=s[5];$('progress').style.width=`${t/duration*100}%`;}const start=performance.now();function frame(now){render(fixed===null?(now-start)/1000%duration:fixed);if(fixed===null)requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
