<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1300" style="background:#fffdf5;font-family:'Segoe UI',Arial,sans-serif">
  <rect x="10" y="10" width="1280" height="1280" rx="4" fill="#fffdf5" stroke="#c8b89a" stroke-width="2"/>
  <text x="650" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d2d2d">Failure Modes and Production Hardening</text>
  <line x1="400" y1="54" x2="900" y2="54" stroke="#c8b89a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- SECTION A: NLB vs ALB -->
  <rect x="30" y="70" width="1240" height="200" rx="6" fill="#fde8e8" fill-opacity="0.3" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="45" y="92" font-size="13" font-weight="bold" fill="#7a0000">A. Load Balancer Layer Mistake — Layer 4 vs Layer 7</text>

  <rect x="50" y="105" width="580" height="140" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="65" y="125" font-size="11" font-weight="bold" fill="#7a0000">WRONG: Application Load Balancer (ALB, Layer 7)</text>
  <text x="65" y="145" font-size="9" fill="#333">ALB terminates the TCP connection at the LB and</text>
  <text x="65" y="159" font-size="9" fill="#333">opens a NEW TCP connection to the backend.</text>
  <text x="65" y="173" font-size="9" fill="#333">The WebSocket upgrade handshake needs to happen</text>
  <text x="65" y="187" font-size="9" fill="#333">on the ORIGINAL TCP connection — ALB breaks it.</text>
  <text x="65" y="207" font-size="10" font-weight="bold" fill="#7a0000">Result: WebSocket upgrade fails.</text>

  <rect x="660" y="105" width="580" height="140" rx="5" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="675" y="125" font-size="11" font-weight="bold" fill="#1a5e20">CORRECT: Network Load Balancer (NLB, Layer 4)</text>
  <text x="675" y="145" font-size="9" fill="#333">NLB passes raw TCP packets straight through to</text>
  <text x="675" y="159" font-size="9" fill="#333">the backend server — no termination happens.</text>
  <text x="675" y="173" font-size="9" fill="#333">The WebSocket HTTP upgrade completes on the</text>
  <text x="675" y="187" font-size="9" fill="#333">actual server; sticky sessions via consistent hash on client IP.</text>
  <text x="675" y="207" font-size="10" font-weight="bold" fill="#1a5e20">Result: WebSocket works correctly.</text>

  <!-- SECTION B: WS crash recovery -->
  <rect x="30" y="290" width="1240" height="260" rx="6" fill="#e8f4fd" fill-opacity="0.3" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="45" y="312" font-size="13" font-weight="bold" fill="#1a4a7a">B. WebSocket Server Crash — Three Safety Layers Prevent Message Loss</text>

  <rect x="50" y="325" width="200" height="60" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a0000">WS Server (crashed)</text>

  <line x1="250" y1="345" x2="360" y2="345" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="365" x2="360" y2="410" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="345" x2="360" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="360" y="315" width="280" height="60" rx="5" fill="#f5f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="500" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a0a7a">Kafka durability</text>
  <text x="375" y="360" font-size="8" fill="#333">Replication factor 3 — another consumer picks up</text>
  <text x="375" y="372" font-size="8" fill="#333">already-published events.</text>

  <rect x="360" y="385" width="280" height="60" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="500" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a0000">Cassandra pre-write</text>
  <text x="375" y="428" font-size="8" fill="#333">Pending message written BEFORE ACK to sender —</text>
  <text x="375" y="440" font-size="8" fill="#333">drained on reconnect to ANY healthy server.</text>

  <rect x="360" y="450" width="280" height="60" rx="5" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="500" y="475" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5e20">Client retry</text>
  <text x="375" y="493" font-size="8" fill="#333">No ACK within 30s &#8594; exponential-backoff resend</text>
  <text x="375" y="505" font-size="8" fill="#333">using the same idempotent message_id.</text>

  <line x1="640" y1="345" x2="750" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="640" y1="415" x2="750" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="640" y1="480" x2="750" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="750" y="370" width="330" height="70" rx="5" fill="#2d2d2d"/>
  <text x="915" y="395" text-anchor="middle" font-size="11" fill="#f8f8f2" font-weight="bold">Net result</text>
  <text x="915" y="415" text-anchor="middle" font-size="10" fill="#f8f8f2">Brief delay (seconds), zero message loss</text>
  <text x="915" y="430" text-anchor="middle" font-size="10" fill="#f8f8f2">across 100K displaced connections.</text>

  <!-- SECTION C: Celebrity fan-out -->
  <rect x="30" y="570" width="1240" height="380" rx="6" fill="#fff3cd" fill-opacity="0.3" stroke="#e6a817" stroke-width="1.5"/>
  <text x="45" y="592" font-size="13" font-weight="bold" fill="#7a4a00">C. Celebrity Presence Fan-Out Problem — Active Watchers Fix</text>

  <rect x="50" y="605" width="580" height="110" rx="5" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="65" y="625" font-size="11" font-weight="bold" fill="#7a0000">Problem</text>
  <text x="65" y="643" font-size="9" fill="#333">500M DAU x heartbeat/15s = 33M presence updates/sec.</text>
  <text x="65" y="657" font-size="9" fill="#333">Naive: notify ALL 200+ contacts on every status change.</text>
  <text x="65" y="671" font-size="9" fill="#333">For a celebrity with 10M followers: notifying all 10M on</text>
  <text x="65" y="685" font-size="9" fill="#333">login is a self-inflicted denial-of-service on your own system.</text>
  <text x="65" y="703" font-size="10" font-weight="bold" fill="#7a0000">6.6 billion fan-out ops/sec if done naively.</text>

  <rect x="660" y="605" width="580" height="110" rx="5" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="625" font-size="11" font-weight="bold" fill="#1a5e20">Fix — Active Watchers</text>
  <text x="675" y="643" font-size="9" fill="#333">Only notify users who currently have that person's chat</text>
  <text x="675" y="657" font-size="9" fill="#333">OPEN right now — typically 1-5 per user, ~10,000 for a</text>
  <text x="675" y="671" font-size="9" fill="#333">celebrity at any given moment.</text>
  <text x="675" y="689" font-size="9" fill="#333">Contacts-list "last seen" is fetched on-demand, never pushed.</text>
  <text x="675" y="703" font-size="10" font-weight="bold" fill="#1a5e20">10,000 vs 10,000,000 = 1000x reduction.</text>

  <rect x="80" y="735" width="1130" height="130" rx="5" fill="#f9f9f9" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="95" y="755" font-size="10" font-weight="bold" fill="#2d2d2d">Redis implementation</text>
  <text x="95" y="775" font-size="9" fill="#333" font-family="monospace">chat opened:  SADD presence:watchers:{user_id} {watcher_ws_server_id}</text>
  <text x="95" y="793" font-size="9" fill="#333" font-family="monospace">chat closed:  SREM presence:watchers:{user_id} {watcher_ws_server_id}</text>
  <text x="95" y="811" font-size="9" fill="#333" font-family="monospace">user offline: SMEMBERS presence:watchers:{user_id} &#8594; notify only those returned servers</text>
  <text x="95" y="833" font-size="9" fill="#555" font-style="italic">The celebrity case: SMEMBERS returns ~10,000 watching servers instead of 10 million followers.</text>
  <text x="95" y="850" font-size="9" fill="#555" font-style="italic">Contacts-list last_seen is fetched on-demand when the contacts tab opens — never proactively pushed.</text>

  <!-- Typing indicator inset -->
  <rect x="80" y="880" width="1130" height="55" rx="5" fill="#f5f0ff" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="95" y="898" font-size="10" font-weight="bold" fill="#4a0a7a">Inset: Typing Indicators</text>
  <text x="95" y="915" font-size="9" fill="#333">Fire-and-forget WS signal, client throttled to 1/3s. Server drops it silently if recipient is offline — never queued,</text>
  <text x="95" y="928" font-size="9" fill="#333">never persisted. A "typing" event delivered hours late from a queue would be meaningless.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
  </defs>

  <text x="650" y="1250" text-anchor="middle" font-size="10" fill="#aaa">Chat System Design — Failure Modes and Production Hardening</text>
</svg>
