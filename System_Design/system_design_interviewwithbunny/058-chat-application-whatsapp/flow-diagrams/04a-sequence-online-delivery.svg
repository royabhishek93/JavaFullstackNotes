<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" style="background:#fffdf5;font-family:'Segoe UI',Arial,sans-serif">
  <rect x="10" y="10" width="1480" height="930" rx="4" fill="#fffdf5" stroke="#c8b89a" stroke-width="2"/>
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d2d2d">Sequence: Online Delivery Across Different Servers</text>
  <line x1="500" y1="52" x2="1000" y2="52" stroke="#c8b89a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Actors -->
  <g id="actors">
    <rect x="30" y="70" width="160" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
    <text x="110" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5e20">User A</text>

    <rect x="230" y="70" width="160" height="46" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="2"/>
    <text x="310" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a7a">ws-server-1</text>

    <rect x="430" y="70" width="160" height="46" rx="6" fill="#fff3cd" stroke="#e6a817" stroke-width="2"/>
    <text x="510" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a00">Chat Service</text>

    <rect x="630" y="70" width="170" height="46" rx="6" fill="#f5f0ff" stroke="#8e44ad" stroke-width="2"/>
    <text x="715" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a0a7a">Redis ws_registry</text>

    <rect x="840" y="70" width="160" height="46" rx="6" fill="#f5f0ff" stroke="#8e44ad" stroke-width="2"/>
    <text x="920" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a0a7a">Redis Stream</text>

    <rect x="1040" y="70" width="160" height="46" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="2"/>
    <text x="1120" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a7a">ws-server-3</text>

    <rect x="1240" y="70" width="160" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
    <text x="1320" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5e20">User B</text>
  </g>

  <!-- Lifelines -->
  <line x1="110" y1="116" x2="110" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="310" y1="116" x2="310" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="510" y1="116" x2="510" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="715" y1="116" x2="715" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="920" y1="116" x2="920" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1120" y1="116" x2="1120" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1320" y1="116" x2="1320" y2="880" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1 -->
  <line x1="110" y1="150" x2="305" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="115" y="145" font-size="10" fill="#333">1. WS SEND msg {to: userB, content}</text>

  <!-- Step 2 -->
  <line x1="310" y1="185" x2="505" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="315" y="180" font-size="10" fill="#333">2. forward msg to Chat Service</text>

  <!-- Step 3 -->
  <line x1="510" y1="220" x2="710" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="515" y="215" font-size="10" fill="#333">3. HGET ws_registry user:B</text>

  <!-- Step 4 -->
  <line x1="715" y1="255" x2="515" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="250" font-size="10" fill="#333">4. returns {server: ws-server-3}</text>

  <!-- Step 5 self-note -->
  <rect x="530" y="270" width="330" height="30" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="540" y="290" font-size="9" fill="#7a0000">5. persist to Cassandra, status = PENDING (self-processing)</text>

  <!-- Step 6 -->
  <line x1="510" y1="325" x2="915" y2="325" stroke="#555" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="515" y="320" font-size="10" fill="#333">6. XADD stream:ws-server-3 {msg for user B}</text>

  <!-- Step 7 -->
  <line x1="510" y1="360" x2="115" y2="360" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="150" y="355" font-size="10" fill="#27ae60">7. ACK &#8594; User A sees single tick (server received)</text>

  <!-- Step 8 -->
  <line x1="1120" y1="395" x2="925" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="930" y="390" font-size="10" fill="#333">8. XREAD stream:ws-server-3</text>

  <!-- Step 9 -->
  <rect x="1010" y="410" width="240" height="26" rx="4" fill="#f5f0ff" stroke="#8e44ad" stroke-width="1"/>
  <text x="1020" y="428" font-size="9" fill="#4a0a7a">9. receives msg payload</text>

  <!-- Step 10 -->
  <line x1="1120" y1="460" x2="1315" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1125" y="455" font-size="10" fill="#333">10. push message via WebSocket</text>

  <!-- Step 11 -->
  <line x1="1320" y1="495" x2="1125" y2="495" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="1130" y="490" font-size="10" fill="#27ae60">11. DELIVERY_ACK</text>

  <!-- Step 12 -->
  <line x1="1120" y1="530" x2="515" y2="530" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="520" y="525" font-size="10" fill="#27ae60">12. forward DELIVERY_ACK to Chat Service</text>

  <!-- Step 13 self-note -->
  <rect x="530" y="545" width="330" height="26" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="540" y="563" font-size="9" fill="#7a0000">13. update Cassandra: status = DELIVERED</text>

  <!-- Step 14 -->
  <line x1="510" y1="595" x2="115" y2="595" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="590" font-size="10" fill="#1a4a7a">14. ACK &#8594; User A sees double tick (delivered)</text>

  <line x1="300" y1="625" x2="1330" y2="625" stroke="#c8b89a" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="320" y="640" font-size="9" fill="#888" font-style="italic">... later, User B opens the chat ...</text>

  <!-- Step 15 -->
  <line x1="1320" y1="670" x2="1125" y2="670" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1130" y="665" font-size="10" fill="#333">15. READ_ACK</text>

  <line x1="1120" y1="700" x2="515" y2="700" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="695" font-size="10" fill="#333">16. forward READ_ACK to Chat Service</text>

  <rect x="530" y="715" width="330" height="26" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="540" y="733" font-size="9" fill="#7a0000">update Cassandra: status = READ</text>

  <line x1="510" y1="760" x2="115" y2="760" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="755" font-size="10" fill="#1a4a7a">User A sees blue tick (read)</text>

  <!-- Legend -->
  <rect x="30" y="800" width="1420" height="60" rx="6" fill="#f9f9f9" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="820" font-size="11" font-weight="bold" fill="#2d2d2d">Delivery Receipt Legend</text>
  <text x="45" y="838" font-size="10" fill="#333">single tick = server received (step 7)   |   double tick = recipient device received (step 14)   |   blue tick = recipient read the message (final step)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/></marker>
  </defs>

  <text x="750" y="915" text-anchor="middle" font-size="10" fill="#aaa">Chat System Design — Online Delivery Sequence</text>
</svg>
