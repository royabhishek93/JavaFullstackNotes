<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" style="background:#fffdf5;font-family:'Segoe UI',Arial,sans-serif">
  <rect x="10" y="10" width="1480" height="980" rx="4" fill="#fffdf5" stroke="#c8b89a" stroke-width="2"/>
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d2d2d">Sequence: Offline Delivery and Reconnect</text>
  <line x1="500" y1="52" x2="1000" y2="52" stroke="#c8b89a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="30" y="70" width="150" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="105" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5e20">User A</text>

  <rect x="220" y="70" width="150" height="46" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="2"/>
  <text x="295" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a4a7a">ws-server-1</text>

  <rect x="410" y="70" width="150" height="46" rx="6" fill="#fff3cd" stroke="#e6a817" stroke-width="2"/>
  <text x="485" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a00">Chat Service</text>

  <rect x="600" y="70" width="170" height="46" rx="6" fill="#f5f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="685" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a0a7a">Redis ws_registry</text>

  <rect x="810" y="70" width="150" height="46" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="885" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a0000">Cassandra</text>

  <rect x="1000" y="70" width="180" height="46" rx="6" fill="#f5f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="1090" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a0a7a">Notification Svc</text>

  <rect x="1230" y="70" width="180" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="1320" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5e20">User B (offline)</text>

  <line x1="105" y1="116" x2="105" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="295" y1="116" x2="295" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="485" y1="116" x2="485" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="685" y1="116" x2="685" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="885" y1="116" x2="885" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1090" y1="116" x2="1090" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1320" y1="116" x2="1320" y2="930" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <line x1="105" y1="150" x2="290" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="110" y="145" font-size="10" fill="#333">1. WS SEND msg to ws-server-1</text>

  <line x1="295" y1="180" x2="480" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="175" font-size="10" fill="#333">2. forward to Chat Service</text>

  <line x1="485" y1="210" x2="680" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="205" font-size="10" fill="#333">3. HGET ws_registry user:B</text>

  <line x1="685" y1="240" x2="490" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="495" y="235" font-size="10" fill="#333">4. returns null (no entry &#8594; offline)</text>

  <line x1="485" y1="275" x2="880" y2="275" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="490" y="270" font-size="10" fill="#333">5. INSERT message, status = PENDING</text>

  <line x1="485" y1="310" x2="110" y2="310" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="140" y="305" font-size="10" fill="#27ae60">6. ACK &#8594; single tick</text>

  <line x1="485" y1="345" x2="1085" y2="345" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="490" y="340" font-size="10" fill="#333">7. trigger FCM / APNs push</text>

  <line x1="1090" y1="375" x2="1315" y2="375" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="1095" y="370" font-size="10" fill="#4a0a7a">8. push notification wakes device</text>

  <line x1="250" y1="410" x2="1350" y2="410" stroke="#c8b89a" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="270" y="425" font-size="9" fill="#888" font-style="italic">... time passes, User B's phone regains connectivity ...</text>

  <line x1="1320" y1="460" x2="300" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="455" font-size="10" fill="#333">9. HTTP upgrade &#8594; new WebSocket connection established</text>

  <rect x="240" y="475" width="330" height="26" rx="4" fill="#f5f0ff" stroke="#8e44ad" stroke-width="1"/>
  <text x="250" y="493" font-size="9" fill="#4a0a7a">10. HSET ws_registry user:B &#8594; {server, conn_id} (new entry)</text>

  <rect x="240" y="515" width="600" height="46" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="250" y="533" font-size="9" fill="#1a4a7a">Presence detection = this whole mechanism: HGET returns non-null &#8594; ONLINE.</text>
  <text x="250" y="549" font-size="9" fill="#1a4a7a">Registry TTL = 60s, refreshed by a 30s heartbeat; expiry (no polling) = OFFLINE.</text>

  <line x1="485" y1="590" x2="880" y2="590" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="585" font-size="10" fill="#333">11. SELECT * WHERE receiver_id=B AND status=PENDING ORDER BY timestamp</text>

  <line x1="885" y1="625" x2="490" y2="625" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="495" y="620" font-size="10" fill="#333">12. returns pending messages, in order</text>

  <line x1="485" y1="660" x2="1315" y2="660" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="655" font-size="10" fill="#333">13. push all pending messages via WebSocket, in order</text>

  <line x1="1320" y1="695" x2="490" y2="695" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="495" y="690" font-size="10" fill="#27ae60">14. DELIVERY_ACK for each message</text>

  <rect x="240" y="710" width="330" height="26" rx="4" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="250" y="728" font-size="9" fill="#7a0000">update Cassandra: status = DELIVERED</text>

  <line x1="485" y1="760" x2="110" y2="760" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="140" y="755" font-size="10" fill="#1a4a7a">Sender (User A) receives double tick for each message</text>

  <rect x="30" y="800" width="1420" height="120" rx="6" fill="#f9f9f9" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="820" font-size="11" font-weight="bold" fill="#2d2d2d">Key point</text>
  <text x="45" y="838" font-size="10" fill="#333">Steps 9-14 all happen automatically on reconnect, with zero user action — this is why undelivered messages appear</text>
  <text x="45" y="854" font-size="10" fill="#333">instantly the moment the app regains connectivity, without the user needing to refresh or re-open anything.</text>
  <text x="45" y="875" font-size="10" fill="#333">No message is ever lost between steps 5 and 11: Cassandra is written BEFORE the sender's ACK, so it survives</text>
  <text x="45" y="891" font-size="10" fill="#333">any crash of the Chat Service or the WebSocket server in between.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e74c3c"/></marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/></marker>
  </defs>

  <text x="750" y="965" text-anchor="middle" font-size="10" fill="#aaa">Chat System Design — Offline Delivery and Reconnect Sequence</text>
</svg>
