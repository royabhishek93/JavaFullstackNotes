<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Application Production Design</title>
  <style>
    :root{--ink:#172b4d;--muted:#5e7188;--bg:#f5f7f8;--line:#d5dee7;--blue:#1769aa;--teal:#008c78;--orange:#d57b16;--red:#ca4d4a;--blue-pale:#e8f3fb;--teal-pale:#e3f6f1;--orange-pale:#fff3e4;--red-pale:#fcedea}*{box-sizing:border-box}body{align-items:center;background:var(--bg);color:var(--ink);display:flex;font-family:Arial,sans-serif;height:100vh;justify-content:center;margin:0;overflow:hidden}main{background:#fff;box-shadow:0 12px 35px rgba(23,43,77,.08);display:grid;grid-template-rows:auto 1fr auto;height:720px;overflow:hidden;padding:36px 54px 28px;position:relative;width:1280px}main:before{background-image:linear-gradient(rgba(23,43,77,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(23,43,77,.025) 1px,transparent 1px);background-size:36px 36px;content:"";inset:0;position:absolute}header,section,footer{position:relative;z-index:1}header{align-items:flex-start;display:flex;justify-content:space-between}.eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:1.7px;margin:0 0 8px;text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:30px;margin:0}.time{color:var(--muted);font-size:14px;font-weight:700;padding-top:6px}.content{align-items:center;display:grid;gap:40px;grid-template-columns:.86fr 1.14fr;padding:18px 10px 10px}.section-label{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:1.4px;margin:0 0 12px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:0 0 18px}.lead{color:var(--muted);font-size:18px;line-height:1.48;margin:0}.takeaways{display:grid;gap:11px;margin-top:23px}.takeaway{border-left:4px solid var(--teal);font-size:14px;line-height:1.35;padding:7px 0 7px 12px}.takeaway:nth-child(2){border-color:var(--orange)}.takeaway:nth-child(3){border-color:var(--red)}.canvas{background:#fcfdfd;border:1px solid var(--line);height:385px;overflow:hidden;padding:24px;position:relative}.nodes{align-items:center;display:flex;gap:10px;height:100%;justify-content:center}.node{background:#fff;border:2px solid var(--blue);box-shadow:0 4px 10px rgba(23,43,77,.07);font-size:13px;font-weight:700;min-width:104px;padding:15px 11px;text-align:center}.node small{color:var(--muted);display:block;font-size:10px;font-weight:400;line-height:1.3;margin-top:6px}.node.teal{background:var(--teal-pale);border-color:var(--teal)}.node.orange{background:var(--orange-pale);border-color:var(--orange)}.node.red{background:var(--red-pale);border-color:var(--red)}.arrow{color:var(--blue);font-size:31px;font-weight:400}.stack{display:grid;gap:12px;width:100%}.row{align-items:center;display:flex;gap:12px;justify-content:center}.caption{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center;text-transform:uppercase}.phone{background:#172b4d;border:8px solid #172b4d;border-radius:22px;color:#fff;font-size:12px;height:230px;padding:20px;width:155px}.bubble{background:#31577d;border-radius:9px;margin:12px 0;padding:10px}.bubble.green{background:var(--teal)}.stream{background:var(--teal-pale);border:2px solid var(--teal);font:12px/1.5 Menlo,monospace;padding:16px;width:100%}.db{background:var(--blue-pale);border:2px solid var(--blue);font:12px/1.5 Menlo,monospace;padding:15px;width:100%}.code{background:#172b4d;color:#eff7ff;font:13px/1.65 Menlo,monospace;padding:18px;text-align:left;width:100%}.code b{color:#8ce6d4}.code i{color:#ffd78d;font-style:normal}.class-box{border:2px solid var(--blue);min-width:175px;padding:12px;text-align:left}.class-box b{color:var(--blue);display:block;font-size:14px;margin-bottom:7px}.class-box span{color:var(--muted);display:block;font:11px/1.45 Menlo,monospace}.metric{background:#fff;border:1px solid var(--line);min-width:122px;padding:16px;text-align:center}.metric b{color:var(--blue);display:block;font-size:25px}.metric span{color:var(--muted);font-size:11px}.decision{background:var(--blue-pale);border:2px solid var(--blue);font-size:15px;font-weight:700;padding:15px;text-align:center;width:210px}.decision.yes{background:var(--teal-pale);border-color:var(--teal)}.decision.no{background:var(--red-pale);border-color:var(--red)}footer{align-items:center;border-top:1px solid var(--line);display:flex;gap:14px;padding-top:17px}.track{background:#e8ecec;flex:1;height:5px}.track span{background:var(--red);display:block;height:100%}.footer-label{color:var(--muted);font-size:12px;font-weight:700;min-width:190px;text-align:right}
  </style>
</head>
<body><main><header><div><p class="eyebrow">Production System Design</p><p class="brand">Chat Application Like WhatsApp</p></div><p class="time" id="time"></p></header><section class="content"><div><p class="section-label" id="section"></p><h1 id="title"></h1><p class="lead" id="lead"></p><div class="takeaways" id="takeaways"></div></div><div class="canvas" id="canvas"></div></section><footer><div class="track"><span id="progress"></span></div><div class="footer-label" id="footer"></div></footer></main>
<script>
const node=(name,detail='',tone='')=>`<div class="node ${tone}">${name}<small>${detail}</small></div>`;
const slides=[
['1. The user problem','Make conversations feel instant and never lose a message.','A chat application must deliver messages quickly when the receiver is online, store them safely when the receiver is offline, preserve conversation order, support groups, and handle photos and videos.',['Online delivery should feel immediate.','Offline users must receive messages after reconnecting.','The server should never need to read encrypted message content.'],`<div class="nodes"><div class="phone"><div class="bubble green">Hi</div><div class="bubble">Hello</div><div class="bubble green">Photo</div></div><div class="arrow"><-></div>${node('Chat Platform','live + durable','teal')}<div class="arrow"><-></div><div class="phone"><div class="bubble">Hi</div><div class="bubble green">Hello</div><div class="bubble">Photo</div></div></div>`,'Messaging fundamentals'],
['2. Start with WebSocket','Keep one live two-way connection open.','WebSocket lets the phone send a message, receive a message, send an acknowledgement, and show typing status over one persistent connection. It avoids repeatedly creating HTTP requests.',['Use WSS: encrypted WebSocket.','Both client and server can push at any time.','Reconnect automatically after a network break.'],`<div class="stack"><div class="row"><div class="phone"><div class="bubble green">send message</div></div><div class="arrow"><-></div>${node('WebSocket Server','one live connection','teal')}<div class="arrow"><-></div><div class="phone"><div class="bubble">receive message</div></div></div><div class="caption">One connection carries message, ACK, typing, and presence events.</div></div>`,'Real-time transport'],
['3. HLD: complete system map','HLD shows the major production components.','Clients connect through a load balancer to WebSocket servers. Chat Service saves messages, routes delivery work, and coordinates presence, notifications, media, and history storage.',['WebSocket servers own live connections.','Chat Service owns message acceptance and routing.','Each storage system is chosen for one job.'],`<div class="stack"><div class="row">${node('Mobile + Web Apps','WSS','orange')}<div class="arrow">-></div>${node('Load Balancer','route connection','')}<div class="arrow">-></div>${node('WebSocket Fleet','live sockets','blue')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Chat Service','validate + route','blue')}<div class="arrow">-></div>${node('Cassandra','message history','teal')}<div class="arrow">+</div>${node('Redis Streams','hot delivery','teal')}</div><div class="row">${node('Presence','Redis','orange')}${node('Push','FCM / APNs','orange')}${node('Media','S3 + CDN','orange')}</div></div>`,'HLD component diagram'],
['4. Connection ownership','Know which server owns a live user connection.','With many WebSocket servers, the Chat Service needs a quick lookup: where is the recipient connected? Redis stores a short-lived registry from user and device to the owning WebSocket server.',['A heartbeat refreshes the registry TTL.','Reconnect can land on another server safely.','A missing registry entry means the user is offline.'],`<div class="stack"><div class="row">${node('userB device','connected','orange')}<div class="arrow">-></div>${node('WS Server 7','owns socket','blue')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Redis Registry','userB -> server7 | TTL 60s','teal')}</div><div class="caption">The lookup routes delivery to the correct live connection.</div></div>`,'WebSocket registry'],
['5. Send a message','Persist first, then deliver.','When sender A sends a message, the WebSocket server validates it and passes it to Chat Service. Chat Service assigns a message ID and conversation sequence, saves the durable record, and only then starts delivery.',['Sender gets a server ACK after durable save.','A client-generated ID makes retries safe.','Conversation sequence keeps messages ordered.'],`<div class="stack"><div class="row">${node('Sender A','send(message)','orange')}<div class="arrow">-></div>${node('WebSocket Server','validate','blue')}<div class="arrow">-></div>${node('Chat Service','sequence + persist','blue')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Cassandra','durable message saved','teal')}<div class="arrow">-></div><div class="decision yes">single tick: server accepted</div></div></div>`,'Critical write flow'],
['6. Store messages for history','Use an append-friendly message store.','Messages are narrow records that are written once and usually read by conversation and time. Cassandra is a good fit because it handles high write volume and efficiently loads the most recent messages in a conversation.',['Partition by conversation and time bucket.','Order by server sequence or timestamp.','Cassandra is the durable source of truth.'],`<div class="db">CASSANDRA MESSAGE TABLE\n\nPartition key: conversation_id + time_bucket\nClustering key: server_sequence\n\nconversation: A-B | sequence: 102 | sender: A\nconversation: A-B | sequence: 103 | sender: B\nconversation: A-B | sequence: 104 | sender: A\n\nRead: last 50 messages in one conversation</div>`,'Message history storage'],
['7. Deliver to an online user','Use Redis Streams for fast routing work.','After Cassandra confirms the save, Chat Service adds delivery work to the stream for the WebSocket server that owns the recipient connection. That server reads the stream and pushes the message through the live socket.',['One stream per WebSocket server, not per user.','Consumer groups track pending delivery work.','A retry is safe because the client deduplicates by message ID.'],`<div class="stack"><div class="row">${node('Chat Service','message accepted','blue')}<div class="arrow">-></div><div class="stream">XADD server.7.inbox\nmessage_id=abc | recipient=userB</div></div><div class="row"><div class="arrow">v</div></div><div class="row">${node('WS Server 7','XREADGROUP','teal')}<div class="arrow">-></div>${node('Receiver B','live message','orange')}</div></div>`,'Online delivery path'],
['8. Delivery and read receipts','Use simple acknowledgements for user-visible status.','A single tick means the server saved the message. A double tick means the recipient device received it. A read receipt means the recipient opened it. Each update is an event, not a guess.',['Transport is at least once.','Message ID deduplication avoids duplicate UI bubbles.','Exactly-once user experience is practical; exactly-once transport is not claimed.'],`<div class="stack"><div class="row">${node('SENT','server saved','blue')}<div class="arrow">-></div>${node('DELIVERED','device ACK','teal')}<div class="arrow">-></div>${node('READ','opened by user','orange')}</div><div class="caption">Each state is stored and sent back to the sender.</div></div>`,'ACK state machine'],
['9. Offline delivery','Store safely, wake the device, deliver on reconnect.','If recipient B is offline, there is no live WebSocket registry entry. The durable message remains in Cassandra as pending. The notification service sends a small push notification through FCM or APNs. On reconnect, the client fetches missed messages in order.',['Push notification is not delivery proof.','Cassandra remains the source of pending messages.','Client ACK updates status after real receipt.'],`<div class="stack"><div class="row">${node('Chat Service','recipient offline','blue')}<div class="arrow">-></div>${node('Cassandra','PENDING message','teal')}<div class="arrow">-></div>${node('FCM / APNs','wake device','orange')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Reconnect','fetch pending','blue')}<div class="arrow">-></div>${node('Receiver B','ACK delivered','teal')}</div></div>`,'Offline recovery flow'],
['10. Presence and typing','Treat presence as temporary information.','Online status and typing indicators change frequently and can be slightly stale. Redis is a good fit because it is fast and because losing a typing event is acceptable. Durable messages must never depend on this data.',['Presence uses heartbeat plus TTL.','Publish online and offline changes with Redis Pub/Sub.','Typing events are best-effort and short lived.'],`<div class="stack"><div class="row">${node('WS Server','heartbeat every 30s','blue')}<div class="arrow">-></div>${node('Redis Presence','online | last seen | TTL','teal')}</div><div class="row">${node('Typing event','ephemeral','orange')}<div class="arrow">-></div>${node('Redis Pub/Sub','notify active chat','teal')}</div></div>`,'Presence design'],
['11. Group messages','Fan out carefully for group conversations.','For a normal group with up to a few hundred members, fanout on write is simple. Save the message once, then create delivery work for each member. For extremely large groups, use a hybrid or fanout-on-read approach.',['Small group: low read latency, more writes.','Large group: avoid sending millions of copies immediately.','Membership must be checked before every group send.'],`<div class="stack"><div class="row">${node('Group message','one sender','orange')}<div class="arrow">-></div>${node('Chat Service','get members','blue')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Member A inbox','delivery work','teal')}${node('Member B inbox','delivery work','teal')}${node('Member C inbox','delivery work','teal')}</div></div>`,'Group fanout'],
['12. Media is a separate flow','Do not push large files through WebSocket.','A photo or video is too large for the normal message path. The app asks Media Service for a short-lived pre-signed upload URL, uploads directly to object storage, then sends a small encrypted media reference as a chat message.',['Client uploads bytes directly to S3.','Chat message stores media metadata and reference.','CDN serves downloads close to the recipient.'],`<div class="stack"><div class="row">${node('Client','request upload URL','orange')}<div class="arrow">-></div>${node('Media Service','authorize','blue')}<div class="arrow">-></div>${node('S3','pre-signed upload','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Chat Message','media reference only','blue')}<div class="arrow">-></div>${node('CDN','fast download','teal')}</div></div>`,'Media upload and delivery'],
['13. End-to-end encryption','Server routes ciphertext, not readable chat text.','In end-to-end encryption, the sender encrypts before sending. The server stores and routes encrypted bytes. The recipient device decrypts. This protects privacy, but it also limits server-side search and content moderation.',['The server can still route by user and conversation ID.','Keys live on devices, not in the message store.','Group chats use group sender-key distribution.'],`<div class="stack"><div class="row">${node('Sender device','encrypt plaintext','orange')}<div class="arrow">-></div>${node('Server','ciphertext only','blue')}<div class="arrow">-></div>${node('Receiver device','decrypt','teal')}</div><div class="code"><b>server record</b>\nconversation_id: group42\ncontent: <i>encrypted bytes</i>\nserver cannot read message text</div></div>`,'Privacy boundary'],
['14. LLD: core classes','LLD shows the code responsibilities.','WebSocketConnectionManager owns live sockets. ChatService validates and accepts messages. MessageRepository persists history. DeliveryRouter selects online stream delivery or offline notification. Each piece has one job.',['Connection code does not own durable storage.','Chat service does not store socket objects.','Delivery routing depends on presence lookup.'],`<div class="stack"><div class="row"><div class="class-box"><b>ChatService</b><span>sendMessage()</span></div><div class="arrow">-></div><div class="class-box"><b>MessageRepository</b><span>save()</span></div></div><div class="row"><div class="arrow">v</div><div class="arrow">v</div></div><div class="row"><div class="class-box"><b>DeliveryRouter</b><span>route(message)</span></div><div class="arrow">-></div><div class="class-box"><b>ConnectionRegistry</b><span>find(user)</span></div></div></div>`,'LLD class diagram'],
['15. LLD: delivery strategy','Choose delivery behavior based on recipient state.','DeliveryRouter uses the connection registry. If the recipient has a live socket, it publishes work to that server Redis Stream. If not, it records pending status and asks NotificationService to send a push notification.',['Online and offline routes share the same durable message ID.','Retry logic is idempotent.','The client removes duplicate messages by ID.'],`<div class="stack"><div class="row"><div class="class-box"><b>DeliveryRouter</b><span>route(message)</span></div></div><div class="row"><div class="arrow">v</div></div><div class="row"><div class="decision yes">Online\nRedis Stream -> WebSocket</div><div class="decision no">Offline\nCassandra pending -> Push</div></div></div>`,'LLD routing decision'],
['16. Ordering and duplicates','Guarantee a sensible user experience, not impossible transport perfection.','Each conversation receives increasing server sequence IDs. Clients render messages in sequence order and briefly buffer messages that arrive out of order. Every message has an idempotency key so sender retries and delivery retries do not create duplicate chat bubbles.',['Order is per conversation, not global.','At-least-once delivery is expected.','Client-side deduplication creates exactly-once UX.'],`<div class="db">CONVERSATION A-B\n\nmessage abc -> sequence 101\nmessage def -> sequence 102\nmessage ghi -> sequence 103\n\nClient receives 101, 103, 102\nClient buffer renders: 101, 102, 103</div>`,'Ordering and idempotency'],
['17. Reliability and reconnect','Expect servers and networks to fail.','A WebSocket server can crash because it owns connections, not message truth. Clients reconnect with backoff and jitter. The new server restores the registry entry, while the app fetches pending messages from Cassandra.',['Sender retries an unacknowledged message with the same ID.','Redis Stream consumers reclaim pending work after a crash.','Durable history makes recovery possible.'],`<div class="stack"><div class="row">${node('WS Server crash','connection lost','red')}<div class="arrow">-></div>${node('Client reconnect','backoff + jitter','orange')}<div class="arrow">-></div>${node('New WS Server','registry refreshed','blue')}</div><div class="row">${node('Cassandra','fetch pending history','teal')}<div class="arrow">-></div>${node('Client','restore conversation','teal')}</div></div>`,'Failure recovery'],
['18. Operate the chat platform','Measure the things users feel.','Real-time systems need close monitoring. Track message delivery delay, WebSocket connection count, reconnect rate, pending stream entries, Cassandra write latency, push-notification success, and group-fanout lag.',['Alert when delivery p99 exceeds the target.','Watch hot conversations and overloaded WebSocket servers.','Load test reconnect storms and large group sends.'],`<div class="nodes"><div class="metric"><b>&lt;100ms</b><span>delivery p99</span></div><div class="metric"><b>400M</b><span>connections</span></div><div class="metric"><b>700K/s</b><span>peak messages</span></div><div class="metric"><b>0</b><span>pending backlog goal</span></div></div>`,'Production observability'],
['19. Capacity and scale','Scale each component for its own workload.','WebSocket servers scale by open connection count. Cassandra scales by message writes and history reads. Redis Streams scales by delivery throughput. S3 and CDN handle media bytes. Kafka can feed replayable analytics, search, audit, and change-data consumers.',['Keep hot delivery separate from slow analytics.','Partition data by conversation or server ownership.','Use regional deployment and replication for global users.'],`<div class="nodes">${node('WebSocket Fleet','connections','blue')}<div class="arrow">+</div>${node('Cassandra','history writes','teal')}<div class="arrow">+</div>${node('Redis Streams','delivery work','teal')}<div class="arrow">+</div>${node('S3 + CDN','media','orange')}</div>`,'Scaling model'],
['20. Final production design','A clear flow protects real user conversations.','WebSocket provides live two-way communication. Cassandra makes message history durable. Redis registry and Streams route fast delivery. Push handles offline users. S3 plus CDN handles media. HLD explains the system; LLD keeps the code maintainable.',['Persist before delivery.','Use ACKs, sequence IDs, and idempotency keys.','Design for reconnect, offline users, and group fanout.'],`<div class="stack"><div class="row">${node('WebSocket','live chat','blue')}<div class="arrow">+</div>${node('Cassandra','durable truth','teal')}<div class="arrow">+</div>${node('Redis Streams','fast delivery','teal')}</div><div class="row"><div class="decision yes">Reliable real-time messaging at production scale</div></div></div>`,'Production summary']
];
const duration=300,requested=new URLSearchParams(location.search).get('time'),fixed=requested===null?null:Math.max(0,Math.min(duration-.01,Number(requested))),$=id=>document.getElementById(id);
function render(time){const index=Math.min(slides.length-1,Math.floor(time/15)),slide=slides[index];$('time').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')} / 05:00`;$('section').textContent=`Chapter ${index+1} of ${slides.length}`;$('title').textContent=slide[1];$('lead').textContent=slide[2];$('takeaways').innerHTML=slide[3].map(item=>`<div class="takeaway">${item}</div>`).join('');$('canvas').innerHTML=slide[4];$('footer').textContent=slide[5];$('progress').style.width=`${time/duration*100}%`;}const start=performance.now();function frame(now){render(fixed===null?(now-start)/1000%duration:fixed);if(fixed===null)requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
