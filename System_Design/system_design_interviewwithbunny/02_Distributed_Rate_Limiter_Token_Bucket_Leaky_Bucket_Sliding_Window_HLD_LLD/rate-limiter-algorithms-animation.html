<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rate Limiter Algorithms in Motion</title>
  <style>
    :root{--ink:#183153;--muted:#60708a;--paper:#f7f4ec;--panel:#fff;--line:#d8dfdf;--mint:#00a884;--coral:#e85b4f;--gold:#f2b134;--blue:#3f82c5;--pale:#dbeafd}*{box-sizing:border-box}body{align-items:center;background:var(--paper);color:var(--ink);display:flex;font-family:Georgia,serif;height:100vh;justify-content:center;margin:0;overflow:hidden}main{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;height:720px;overflow:hidden;padding:42px 52px 32px;position:relative;width:1280px}main:before{background:repeating-linear-gradient(90deg,transparent 0 31px,rgba(24,49,83,.03) 32px);content:"";inset:0;position:absolute}header,.stage,footer{position:relative;z-index:1}header{align-items:start;display:flex;justify-content:space-between}.eyebrow{color:var(--coral);font:700 13px Arial;letter-spacing:1.8px;margin:0 0 10px;text-transform:uppercase}h1{font-size:39px;line-height:1;margin:0}.counter{color:var(--muted);font:600 16px Arial;padding-top:8px}.stage{align-items:center;display:grid;gap:64px;grid-template-columns:1.1fr .9fr;padding:34px 28px 22px}.algorithm{color:var(--coral);font:700 15px Arial;letter-spacing:1.5px;margin:0 0 12px;text-transform:uppercase}h2{font-size:48px;line-height:.98;margin:0 0 20px}.message{color:var(--muted);font:20px/1.45 Arial;margin:0;max-width:520px}.takeaway{border-left:4px solid var(--mint);font:700 17px/1.35 Arial;margin-top:28px;padding:11px 0 11px 16px}.visual{height:330px;position:relative}.legend{display:flex;gap:16px;font:600 13px Arial;margin-bottom:19px}.legend span{align-items:center;display:flex;gap:6px}.dot{border-radius:50%;display:inline-block;height:10px;width:10px}.green{background:var(--mint)}.red{background:var(--coral)}.yellow{background:var(--gold)}.timeline{border-bottom:2px solid var(--ink);height:174px;position:relative}.tick{bottom:-28px;color:var(--muted);font:12px Arial;position:absolute;transform:translateX(-50%)}.request{align-items:center;background:var(--mint);border-radius:50%;color:#fff;display:flex;font:700 12px Arial;height:31px;justify-content:center;position:absolute;transform:translate(-50%,0);width:31px}.window{background:var(--pale);border:2px solid var(--blue);bottom:0;height:118px;position:absolute}.label{color:var(--blue);font:700 12px Arial;left:10px;position:absolute;top:10px}.boundary{background:var(--coral);bottom:-11px;height:142px;position:absolute;width:3px}.boundary b{color:var(--coral);font:700 12px Arial;left:8px;position:absolute;top:-20px;white-space:nowrap}.rolling{background:rgba(242,177,52,.26);border:2px solid var(--gold);bottom:0;height:118px;position:absolute}.bucket{align-items:end;border:2px solid var(--blue);border-top:0;bottom:0;display:flex;gap:7px;height:170px;justify-content:center;left:92px;padding:14px;position:absolute;width:230px}.bucket:before{border:2px solid var(--blue);border-bottom:0;border-radius:120px 120px 0 0;content:"";height:65px;left:-2px;position:absolute;top:-64px;width:230px}.token{background:var(--mint);border-radius:50%;height:25px;width:25px}.caption{color:var(--blue);font:700 14px Arial;left:104px;position:absolute;top:11px}.status{background:#ffe1dd;border:1px solid var(--coral);color:var(--coral);font:700 14px Arial;opacity:0;padding:9px 12px;position:absolute;right:0;top:18px}.queue{bottom:8px;display:flex;gap:10px;left:25px;position:absolute}.queue i{background:#fff0cd;border:2px solid var(--gold);height:52px;width:58px}.drain{background:var(--blue);bottom:28px;height:5px;left:260px;position:absolute}.constant{bottom:78px;color:var(--blue);font:700 13px Arial;position:absolute;right:0}.downstream{border:2px solid var(--blue);bottom:4px;color:var(--blue);font:700 12px Arial;padding:18px 11px;position:absolute;right:0}footer{align-items:center;display:flex;gap:10px}.progress{background:#e7e8e5;flex:1;height:5px}.progress span{background:var(--coral);display:block;height:100%}.note{color:var(--muted);font:600 12px Arial;min-width:160px;text-align:right}
  </style>
</head>
<body>
  <main><header><div><p class="eyebrow">Distributed Rate Limiting</p><h1>Four algorithms. One traffic burst.</h1></div><div class="counter" id="clock"></div></header><section class="stage"><div><p class="algorithm" id="algorithm"></p><h2 id="title"></h2><p class="message" id="message"></p><p class="takeaway" id="takeaway"></p></div><div class="visual"><div class="legend" id="legend"></div><div class="timeline" id="timeline"></div><div id="visual"></div></div></section><footer><div class="progress"><span id="progress"></span></div><div class="note" id="note"></div></footer></main>
  <script>
    const total=24, requested=new URLSearchParams(location.search).get('time'), fixed=requested===null?null:Math.max(0,Math.min(total,Number(requested)));
    const $=id=>document.getElementById(id), req=(x,y,n)=>`<i class="request" style="left:${x}%;top:${y}px">${n}</i>`, ticks=()=>'<i class="tick" style="left:0">0s</i><i class="tick" style="left:50%">30s</i><i class="tick" style="left:100%">60s</i>';
    function paint(t){const scene=Math.min(3,Math.floor(t/6)), local=t-scene*6; $('clock').textContent=`00:${String(Math.floor(t)).padStart(2,'0')} / 00:24`; $('progress').style.width=`${t/total*100}%`; $('timeline').innerHTML=ticks(); $('visual').innerHTML='';
      if(scene===0){$('algorithm').textContent='Algorithm 01';$('title').textContent='Fixed Window';$('message').textContent='The counter resets on a clock boundary. A client can spend one quota just before the reset and another immediately after it.';$('takeaway').textContent='Fast and small, but the boundary spike is exploitable.';$('legend').innerHTML='<span><i class="dot green"></i>allowed request</span><span><i class="dot red"></i>counter reset</span>';$('timeline').innerHTML+='<div class="window" style="left:0;width:50%"><b class="label">Window A: limit 5</b></div><div class="window" style="left:50%;width:50%"><b class="label">Window B: limit 5</b></div><div class="boundary" style="left:50%"><b>counter resets</b></div>';let a=Math.min(5,Math.floor(local*1.4)+1),b=Math.max(0,Math.min(5,Math.floor((local-2.8)*1.8)+1));for(let i=0;i<a;i++)$('timeline').innerHTML+=req(38+i*2.5,118-i*19,i+1);for(let i=0;i<b;i++)$('timeline').innerHTML+=req(53+i*5,118-i*19,i+6);$('note').textContent=`${a+b} requests around one boundary`}
      if(scene===1){$('algorithm').textContent='Algorithm 02';$('title').textContent='Sliding Window';$('message').textContent='The last 60 seconds move continuously. Old requests age out one at a time, so there is no reset moment to exploit.';$('takeaway').textContent='Accurate rolling limit; a full request log costs memory.';$('legend').innerHTML='<span><i class="dot green"></i>request in window</span><span><i class="dot yellow"></i>rolling 60s window</span>';$('timeline').innerHTML+=`<div class="rolling" style="left:${7+local*5}%;width:66%"><b class="label" style="color:#926800">rolling 60 second window</b></div>`;[20,32,47,61,76].forEach((x,i)=>$('timeline').innerHTML+=req(x,120-(i%3)*25,i+1));$('note').textContent='Events expire continuously'}
      if(scene===2){$('algorithm').textContent='Algorithm 03';$('title').textContent='Token Bucket';$('message').textContent='A full bucket permits a short burst. Each request consumes one token; new tokens arrive continuously at the configured refill rate.';$('takeaway').textContent='General choice for user-facing APIs: burst-friendly and memory-efficient.';$('legend').innerHTML='<span><i class="dot green"></i>available token</span><span><i class="dot red"></i>429 rejected</span>';let spent=Math.min(6,Math.floor(local*2)), refill=local>3.4?Math.min(2,Math.floor((local-3.4)*1.5)):0,count=Math.max(0,6-spent+refill);$('visual').innerHTML=`<b class="caption">capacity: 6 tokens</b><div class="bucket">${Array.from({length:6},(_,i)=>`<i class="token" style="opacity:${i<count?1:0}"></i>`).join('')}</div><b class="status" style="opacity:${spent>=6&&local<3.5?1:0}">429: bucket empty</b>`;$('note').textContent=`${count} token${count===1?'':'s'} available`}
      if(scene===3){$('algorithm').textContent='Algorithm 04';$('title').textContent='Leaky Bucket';$('message').textContent='A burst enters a bounded queue, then exits at a constant rate. The downstream sees a smooth stream rather than the initial spike.';$('takeaway').textContent='Use to shape outbound traffic to a rate-sensitive downstream.';$('legend').innerHTML='<span><i class="dot yellow"></i>queued request</span><span><i class="dot green"></i>drained steadily</span>';let queued=Math.max(0,5-Math.floor(local*.9));$('visual').innerHTML=`<div class="queue">${Array.from({length:5},(_,i)=>`<i style="opacity:${i<queued?1:.18}"></i>`).join('')}</div><div class="drain" style="width:${Math.min(145,local*31)}px"></div><b class="constant">constant drain: 1 request/sec</b><b class="downstream">DOWNSTREAM<br>SERVICE</b>`;$('note').textContent=`${queued} request${queued===1?'':'s'} queued`}}
    const start=performance.now();function frame(now){paint(fixed===null?(now-start)/1000%total:fixed);if(fixed===null)requestAnimationFrame(frame)}requestAnimationFrame(frame);
  </script>
</body>
</html>
