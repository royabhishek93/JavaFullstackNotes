<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distributed Rate Limiter for Production</title>
  <style>
    :root{--ink:#172b4d;--muted:#5e7188;--bg:#f5f7f8;--line:#d5dee7;--blue:#1769aa;--teal:#008c78;--orange:#d57b16;--red:#ca4d4a;--blue-pale:#e8f3fb;--teal-pale:#e3f6f1;--orange-pale:#fff3e4;--red-pale:#fcedea}*{box-sizing:border-box}body{align-items:center;background:var(--bg);color:var(--ink);display:flex;font-family:Arial,sans-serif;height:100vh;justify-content:center;margin:0;overflow:hidden}main{background:#fff;box-shadow:0 12px 35px rgba(23,43,77,.08);display:grid;grid-template-rows:auto 1fr auto;height:720px;overflow:hidden;padding:36px 54px 28px;position:relative;width:1280px}main:before{background-image:linear-gradient(rgba(23,43,77,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(23,43,77,.025) 1px,transparent 1px);background-size:36px 36px;content:"";inset:0;position:absolute}header,section,footer{position:relative;z-index:1}header{align-items:flex-start;display:flex;justify-content:space-between}.eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:1.7px;margin:0 0 8px;text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:30px;margin:0}.time{color:var(--muted);font-size:14px;font-weight:700;padding-top:6px}.content{align-items:center;display:grid;gap:40px;grid-template-columns:.86fr 1.14fr;padding:18px 10px 10px}.section-label{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:1.4px;margin:0 0 12px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:0 0 18px}.lead{color:var(--muted);font-size:18px;line-height:1.48;margin:0}.takeaways{display:grid;gap:11px;margin-top:23px}.takeaway{border-left:4px solid var(--teal);font-size:14px;line-height:1.35;padding:7px 0 7px 12px}.takeaway:nth-child(2){border-color:var(--orange)}.takeaway:nth-child(3){border-color:var(--red)}.canvas{background:#fcfdfd;border:1px solid var(--line);height:385px;overflow:hidden;padding:24px;position:relative}.nodes{align-items:center;display:flex;gap:10px;height:100%;justify-content:center}.node{background:#fff;border:2px solid var(--blue);box-shadow:0 4px 10px rgba(23,43,77,.07);font-size:13px;font-weight:700;min-width:105px;padding:15px 12px;text-align:center}.node small{color:var(--muted);display:block;font-size:10px;font-weight:400;line-height:1.3;margin-top:6px}.node.teal{background:var(--teal-pale);border-color:var(--teal)}.node.orange{background:var(--orange-pale);border-color:var(--orange)}.node.red{background:var(--red-pale);border-color:var(--red)}.arrow{color:var(--blue);font-size:31px;font-weight:400}.stack{display:grid;gap:12px;width:100%}.row{align-items:center;display:flex;gap:12px;justify-content:center}.caption{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center;text-transform:uppercase}.bucket{align-items:flex-end;border:5px solid var(--blue);border-top:0;display:flex;gap:10px;height:190px;justify-content:center;margin:37px auto 0;padding:17px;width:245px}.bucket:before{border:5px solid var(--blue);border-bottom:0;border-radius:140px 140px 0 0;content:"";height:78px;margin-top:-77px;position:absolute;width:245px}.token{background:var(--teal);border-radius:50%;height:28px;width:28px}.token.empty{background:#dce3e6}.token.warn{background:var(--orange)}.status{border:1px solid var(--line);font-size:13px;margin:15px auto 0;padding:9px;text-align:center;width:300px}.status strong{color:var(--red)}.redis{border:2px solid var(--teal);display:grid;gap:12px;grid-template-columns:repeat(3,1fr);padding:15px;width:100%}.shard{background:var(--teal-pale);border:1px solid #a9ddd1;font:12px/1.45 Menlo,monospace;padding:12px}.lane{align-items:center;display:flex;gap:9px;justify-content:center}.lane .node{min-width:92px}.code{background:#172b4d;color:#eff7ff;font:13px/1.65 Menlo,monospace;padding:18px;text-align:left;width:100%}.code b{color:#8ce6d4}.code i{color:#ffd78d;font-style:normal}.class-box{border:2px solid var(--blue);min-width:180px;padding:12px;text-align:left}.class-box b{color:var(--blue);display:block;font-size:14px;margin-bottom:7px}.class-box span{color:var(--muted);display:block;font:11px/1.45 Menlo,monospace}.metric{background:#fff;border:1px solid var(--line);min-width:130px;padding:16px;text-align:center}.metric b{color:var(--blue);display:block;font-size:27px}.metric span{color:var(--muted);font-size:11px}.decision{background:var(--blue-pale);border:2px solid var(--blue);font-size:16px;font-weight:700;padding:18px;text-align:center;width:230px}.decision.yes{background:var(--teal-pale);border-color:var(--teal)}.decision.no{background:var(--red-pale);border-color:var(--red)}footer{align-items:center;border-top:1px solid var(--line);display:flex;gap:14px;padding-top:17px}.track{background:#e8ecec;flex:1;height:5px}.track span{background:var(--red);display:block;height:100%}.footer-label{color:var(--muted);font-size:12px;font-weight:700;min-width:190px;text-align:right}
  </style>
</head>
<body>
  <main><header><div><p class="eyebrow">Production System Design</p><p class="brand">Distributed Rate Limiter</p></div><p class="time" id="time"></p></header><section class="content"><div><p class="section-label" id="section"></p><h1 id="title"></h1><p class="lead" id="lead"></p><div class="takeaways" id="takeaways"></div></div><div class="canvas" id="canvas"></div></section><footer><div class="track"><span id="progress"></span></div><div class="footer-label" id="footer"></div></footer></main>
  <script>
    const node=(name,detail='',tone='')=>`<div class="node ${tone}">${name}<small>${detail}</small></div>`;
    const slides=[
      ['1. The problem','Protect the application before it gets overloaded.','Imagine a flash sale. Thousands of clients ask for the same product at once. Without a limiter, those requests can overwhelm inventory, payment, and database services.',['A rate limiter is the front-door guard.','It decides before the backend starts expensive work.','Too many requests return HTTP 429.'],`<div class="nodes">${node('Client','sends many requests','orange')}<div class="arrow">-></div>${node('Rate Limiter','checks permission','teal')}<div class="arrow">-></div>${node('Backend','payment, search, DB','')}<div class="arrow">-></div>${node('Overloaded','slow or failed','red')}</div>`,'Flash-sale protection'],
      ['2. Who gets a limit?','A limit is attached to an identity, not just a server.','Before counting requests, decide what you want to protect. Most systems use more than one key so that one abusive client cannot hide behind another account.',['Per user: fair usage for logged-in customers.','Per IP: slow down bot traffic and brute-force attempts.','Per endpoint: protect expensive APIs such as image generation.'],`<div class="stack"><div class="row">${node('Request','user123 | IP | /checkout','orange')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('User bucket','100/min','teal')}${node('IP bucket','30/min','teal')}${node('Endpoint bucket','10/min','teal')}</div><div class="caption">If any bucket says no, return HTTP 429</div></div>`,'Rate-limit keys'],
      ['3. Token Bucket','Use entry tickets to understand Token Bucket.','A client owns a small bucket of tickets. Every request uses one ticket. When the bucket is empty, the client must wait for a ticket to return.',['Capacity is the number of tickets saved for a burst.','Refill rate is how quickly tickets return.','This is the usual choice for public APIs.'],`<div class="caption">capacity = 6 tickets | refill = 1 ticket / second</div><div class="bucket">${'<i class="token"></i>'.repeat(4)}${'<i class="token empty"></i>'.repeat(2)}</div><div class="status">4 tickets available: <strong>4 requests can enter now</strong></div>`,'Token Bucket visual'],
      ['4. Burst and refill','A burst is allowed, but it cannot continue forever.','A user who was idle may have a full bucket and can send several requests together. After that burst, the client is limited by the refill rate.',['Useful for mobile apps reconnecting after a network gap.','No fixed clock reset means no boundary exploit.','Empty bucket means 429 plus Retry-After.'],`<div class="stack"><div class="row">${node('Full bucket','6 tickets','teal')}<div class="arrow">-></div>${node('6 requests','burst allowed','orange')}<div class="arrow">-></div>${node('Empty bucket','429 next request','red')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Wait 2 seconds','2 tickets return','')}<div class="arrow">-></div>${node('2 requests','allowed again','teal')}</div></div>`,'Burst vs sustained rate'],
      ['5. HLD: complete request path','HLD shows the main production components.','The load balancer chooses any healthy API Gateway. The gateway is the only component that decides whether the request should enter. Redis holds the shared count; backend services receive only accepted requests.',['Gateway is the enforcement point.','Redis is shared by every gateway.','Postgres stores policy rules, not hot counters.'],`<div class="stack"><div class="row">${node('Client','request','orange')}<div class="arrow">-></div>${node('Load Balancer','routes traffic','')}<div class="arrow">-></div>${node('API Gateway','authenticate + limit','blue')}</div><div class="row"><div class="arrow">v</div><span style="width:240px"></span><div class="arrow">v</div></div><div class="row">${node('Postgres','policy source','orange')}<div class="arrow">-></div>${node('Redis Cluster','shared tickets + cache','teal')}<div class="arrow">-></div>${node('Backend Services','only allowed traffic','')}</div></div>`,'HLD architecture'],
      ['6. Why gateways are stateless','Every gateway must see the same answer.','If each gateway kept its own counter, a client could send traffic to three gateways and get three different limits. Redis gives every gateway one shared view of the client bucket.',['No local counters inside gateways.','Any gateway can handle the next request.','Scaling gateways does not change a client quota.'],`<div class="stack"><div class="row">${node('Gateway 1','no local count','')} ${node('Gateway 2','no local count','')} ${node('Gateway 3','no local count','')}</div><div class="row"><div class="arrow">\u2198</div><div class="arrow">v</div><div class="arrow">\u2199</div></div><div class="row">${node('One shared Redis bucket','user123: 4 tickets left','teal')}</div></div>`,'Shared state'],
      ['7. Redis Cluster and sharding','Split Redis safely as traffic grows.','Redis Cluster divides data into shards. A hash of the client key sends the same user and endpoint to the same shard every time. That keeps the bucket update local and fast.',['Same user plus endpoint always reaches the same shard.','No cross-shard transaction for one bucket.','Add shards when throughput grows.'],`<div class="stack"><div class="row">${node('rate_limit:user123:/orders','hash key','orange')}<div class="arrow">-></div>${node('Shard 2','owns this bucket','teal')}</div><div class="redis"><div class="shard">SHARD 1\nusers A-F\ntokens=95</div><div class="shard">SHARD 2\nusers G-N\ntokens=4</div><div class="shard">SHARD 3\nusers O-Z\ntokens=100</div></div></div>`,'Redis data placement'],
      ['8. Avoid the race condition','Never check first and update later.','Two gateways can receive requests for the same client at the same time. If both read one remaining ticket before either writes, both may allow the request. That breaks the limit.',['Broken approach: GET tokens, then DECR tokens.','There is a gap where two gateways can see the same value.','The fix is one atomic Redis operation.'],`<div class="stack"><div class="row">${node('Gateway 1','GET tokens = 1','orange')}<div class="arrow">...</div>${node('Allow','uses final ticket','red')}</div><div class="row">${node('Gateway 2','GET tokens = 1','orange')}<div class="arrow">...</div>${node('Also allows','bug: 2 requests','red')}</div><div class="caption">Two separate commands create a race window.</div></div>`,'Problem: split read and write'],
      ['9. Redis Lua: one safe decision','Run the entire ticket update as one operation.','A Lua script inside Redis reads the bucket, adds refilled tickets, removes one when possible, saves the new value, and returns allow or deny. No other Redis command can interrupt it.',['One EVAL call replaces GET plus DECR.','First request gets the last ticket.','Second request sees zero and gets 429.'],`<div class="code"><b>1.</b> read tokens and last_refill\n<b>2.</b> <i>tokens = min(capacity, tokens + refill)</i>\n<b>3.</b> if tokens >= 1 then tokens = tokens - 1\n<b>4.</b> save state and return <b>ALLOW</b>\n<b>5.</b> otherwise return <i>DENY</i></div>`,'Atomic Redis Lua script'],
      ['10. Policy versus token state','Store slow-changing rules separately from fast-changing counts.','A policy says what the limit should be. Token state says how many tickets are left right now. Policies belong in Postgres and are copied to Redis; counts live in Redis only.',['Policy: tier, capacity, refill rate, endpoint.','Token state: tokens and last refill time.','TTL removes old buckets for inactive clients.'],`<div class="stack"><div class="row">${node('Postgres','policy rule: 100/min','orange')}<div class="arrow">-></div>${node('Redis policy cache','fast lookup','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Redis token state','user123: 4 tickets left','teal')}</div></div>`,'Two kinds of data'],
      ['11. Production request flow','Follow one request from start to finish.','The gateway learns who is calling, loads their limit policy, asks Redis for one ticket, and makes the final decision. The backend never receives a request that the limiter rejects.',['Policy cache hit is the normal fast path.','Cache miss reads Postgres once and refreshes Redis.','Return helpful headers to an allowed or denied client.'],`<div class="stack"><div class="lane">${node('1. JWT','user123','')}<div class="arrow">-></div>${node('2. Policy','Redis cache','teal')}<div class="arrow">-></div>${node('3. Lua','allow or deny','blue')}</div><div class="lane"><div class="decision yes">ALLOW\nforward to backend</div><div class="decision no">DENY\nHTTP 429 + Retry-After</div></div></div>`,'Request decision flow'],
      ['12. HLD: cache miss path','Use Postgres only when Redis does not know the policy.','A policy cache miss is not an error. The gateway reads the durable rule from Postgres, puts a copy in Redis with a TTL, and then continues with the normal Token Bucket check.',['Most requests should find policy in Redis.','Postgres stays protected from hot-path traffic.','Cache refresh makes the next request faster.'],`<div class="stack"><div class="row">${node('Gateway','policy missing','orange')}<div class="arrow">-></div>${node('Postgres','read rule','')}<div class="arrow">-></div>${node('Redis','save policy','teal')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('Lua Token Bucket','make final decision','blue')}</div></div>`,'HLD cache-miss flow'],
      ['13. LLD: Strategy Pattern','LLD shows the classes and methods in code.','The gateway should not contain a large if-else chain for every algorithm. Instead, it calls one common interface. A factory selects the correct strategy from the policy configuration.',['All strategies expose isAllowed(subject).','Token Bucket is the normal production strategy.','New algorithms do not require changing gateway routing code.'],`<div class="stack"><div class="row"><div class="class-box"><b>RateLimiterStrategy</b><span>+ isAllowed(subject)</span></div></div><div class="row"><div class="arrow">v</div><div class="arrow">v</div><div class="arrow">v</div></div><div class="row"><div class="class-box"><b>TokenBucket</b><span>Redis Lua</span></div><div class="class-box"><b>FixedWindow</b><span>counter</span></div><div class="class-box"><b>LeakyBucket</b><span>queue</span></div></div></div>`,'LLD strategy diagram'],
      ['14. LLD: class collaboration','See how the code pieces work together.','The gateway asks the factory for a limiter strategy. The selected strategy calls Redis for shared state. A policy repository first checks Redis cache and only uses Postgres when needed.',['Gateway owns HTTP behavior and response headers.','Strategy owns the rate-limit algorithm.','Repository owns policy lookup and caching.'],`<div class="stack"><div class="row">${node('API Gateway','handleRequest','blue')}<div class="arrow">-></div>${node('RateLimiterFactory','choose strategy','')}</div><div class="row"><div class="arrow">v</div><span style="width:160px"></span><div class="arrow">v</div></div><div class="row">${node('TokenBucketStrategy','isAllowed','teal')}<div class="arrow">-></div>${node('Redis Lua','shared tokens','teal')}</div><div class="row">${node('PolicyRepository','load policy','orange')}<div class="arrow">-></div>${node('Redis Cache / Postgres','policy source','orange')}</div></div>`,'LLD collaboration'],
      ['15. Update policies safely','Rules can change without redeploying the gateway.','When an administrator changes a plan limit, the policy service saves the new rule to Postgres, updates Redis immediately, and tells gateways to drop old local copies.',['Postgres is the source of truth.','Write-through avoids waiting for TTL expiry.','Pub/Sub makes policy updates visible quickly.'],`<div class="stack"><div class="row">${node('Admin','change limit','orange')}<div class="arrow">-></div>${node('Policy Service','validate and save','')}</div><div class="row"><div class="arrow">v</div><span style="width:200px"></span><div class="arrow">v</div></div><div class="row">${node('Postgres','permanent rule','orange')}<div class="arrow">-></div>${node('Redis + Pub/Sub','fresh policy event','teal')}<div class="arrow">-></div>${node('Gateways','clear old cache','')}</div></div>`,'Policy update flow'],
      ['16. Redis outage: choose a safe behavior','A protection service can fail too.','When Redis is unhealthy, a circuit breaker stops every gateway from waiting on repeated failed Redis calls. The business must decide whether traffic should be allowed or blocked for a short time.',['Fail open: keep the application available; default for many APIs.','Fail closed: block traffic; use for strict compliance cases.','Alert the team and test recovery in half-open state.'],`<div class="stack"><div class="row">${node('Redis errors','10 failures','red')}<div class="arrow">-></div>${node('Circuit OPEN','skip Redis','orange')}</div><div class="row">${node('Public shopping API','fail open','teal')}${node('Payment compliance API','fail closed','red')}</div></div>`,'Circuit breaker decision'],
      ['17. Multi-level protection','One client can be limited in several ways at once.','A user limit protects fairness. An IP limit protects against many fake accounts from one machine. An endpoint limit protects the most expensive operations. Any failed check blocks the request.',['Check user, IP, and endpoint buckets.','The strictest result wins.','Use different limits for different risk levels.'],`<div class="stack"><div class="row">${node('Incoming request','user + IP + endpoint','orange')}</div><div class="row"><div class="arrow">v</div></div><div class="row">${node('User limit','pass','teal')}${node('IP limit','pass','teal')}${node('Endpoint limit','deny','red')}</div><div class="row"><div class="decision no">HTTP 429: one rule denied</div></div></div>`,'Multiple safety checks'],
      ['18. Observability','Know whether the limiter protects or harms the product.','Monitoring tells us if clients are being blocked because of an attack, an incorrect policy, or an overloaded Redis shard. Metrics turn a design into an operable production system.',['429 rate: sudden increase can mean abuse or bad limits.','Redis p99 latency: high values threaten request latency.','Policy cache hit rate: low values overload Postgres.'],`<div class="nodes"><div class="metric"><b>429%</b><span>rejection rate</span></div><div class="metric"><b>p99</b><span>Redis latency</span></div><div class="metric"><b>99%</b><span>policy cache hit</span></div><div class="metric"><b>Top N</b><span>hot endpoints</span></div></div>`,'Operational dashboard'],
      ['19. Capacity planning','Scale each part for its own workload.','Gateways are stateless, so add more instances when request volume grows. Redis is write-heavy because every request changes a bucket. Postgres sees mainly policy updates and occasional cache misses.',['At 1 million requests per second, shard Redis.','Keep Redis close to gateways to reduce latency.','Use TTL so inactive client buckets disappear.'],`<div class="nodes">${node('40 Gateways','stateless fleet','blue')}<div class="arrow">-></div>${node('8 Redis shards','atomic writes','teal')}<div class="arrow">-></div>${node('Postgres','policy source','orange')}</div>`,'Scaling model'],
      ['20. Production checklist','Keep the design simple and safe.','Use Token Bucket at the gateway, keep token state in Redis, make updates atomic with Lua, cache policies, and measure the system. The HLD explains the big components; the LLD explains the clean code structure.',['Token Bucket: burst-friendly client protection.','Redis Lua: one correct shared decision.','HLD plus LLD: scalable system and maintainable code.'],`<div class="stack"><div class="row">${node('Token Bucket','entry tickets','teal')}<div class="arrow">+</div>${node('Redis Lua','atomic decision','blue')}<div class="arrow">+</div>${node('Gateway','front-door guard','orange')}</div><div class="row"><div class="decision yes">Fast, fair, scalable production protection</div></div></div>`,'Final architecture summary']
    ];
    const duration=300,requested=new URLSearchParams(location.search).get('time'),fixed=requested===null?null:Math.max(0,Math.min(duration-.01,Number(requested))),$=id=>document.getElementById(id);
    function render(time){const index=Math.min(slides.length-1,Math.floor(time/15)),slide=slides[index];$('time').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')} / 05:00`;$('section').textContent=`Chapter ${index+1} of ${slides.length}`;$('title').textContent=slide[1];$('lead').textContent=slide[2];$('takeaways').innerHTML=slide[3].map(item=>`<div class="takeaway">${item}</div>`).join('');$('canvas').innerHTML=slide[4];$('footer').textContent=slide[5];$('progress').style.width=`${time/duration*100}%`;}const start=performance.now();function frame(now){render(fixed===null?(now-start)/1000%duration:fixed);if(fixed===null)requestAnimationFrame(frame)}requestAnimationFrame(frame);
  </script>
</body>
</html>
