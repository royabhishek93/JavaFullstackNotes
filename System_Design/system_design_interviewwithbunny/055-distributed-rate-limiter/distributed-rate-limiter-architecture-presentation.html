<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distributed Rate Limiter Architecture</title>
  <style>
    :root { --ink:#142d4a; --muted:#63758b; --paper:#f8f5ed; --blue:#2777bd; --mint:#079879; --coral:#dc5d52; --gold:#d99412; --line:#d9e0e3; }
    * { box-sizing:border-box; }
    body { align-items:center; background:var(--paper); color:var(--ink); display:flex; font-family:Arial,sans-serif; height:100vh; justify-content:center; margin:0; overflow:hidden; }
    main { background:#fff; border:1px solid var(--line); display:grid; grid-template-rows:auto 1fr auto; height:720px; padding:45px 74px 35px; position:relative; width:1280px; }
    main::before { background:repeating-linear-gradient(90deg,transparent 0 39px,rgba(20,45,74,.025) 40px); content:""; inset:0; position:absolute; }
    header, section, footer { position:relative; z-index:1; }
    header { align-items:flex-start; display:flex; justify-content:space-between; }
    .eyebrow { color:var(--coral); font-size:13px; font-weight:700; letter-spacing:1.7px; margin:0 0 12px; text-transform:uppercase; }
    .time { color:var(--muted); font-size:15px; font-weight:700; padding-top:4px; }
    section { align-self:center; display:grid; gap:45px; grid-template-columns:1fr 1.05fr; padding-bottom:25px; }
    .chapter { color:var(--blue); font-size:14px; font-weight:700; letter-spacing:1.4px; margin:0 0 14px; text-transform:uppercase; }
    h1 { font-family:Georgia,serif; font-size:46px; line-height:1.04; margin:0 0 21px; }
    .lead { color:var(--muted); font-size:20px; line-height:1.48; margin:0; }
    .notes { display:grid; gap:11px; margin-top:26px; }
    .note { border-left:4px solid var(--mint); font-size:15px; line-height:1.35; padding:7px 0 7px 13px; }
    .note:nth-child(2) { border-color:var(--gold); }.note:nth-child(3) { border-color:var(--coral); }
    .diagram { background:#fbfcfb; border:1px solid var(--line); color:var(--ink); font:15px/1.43 Menlo,Consolas,monospace; margin:0; min-height:330px; padding:23px; white-space:pre-wrap; }
    .diagram b { color:var(--blue); }
    footer { align-items:center; display:flex; gap:15px; }.track { background:#e5e8e5; flex:1; height:5px; }.track span { background:var(--coral); display:block; height:100%; }.caption { color:var(--muted); font-size:13px; font-weight:700; min-width:205px; text-align:right; }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">Distributed Rate Limiter | Architecture Walkthrough</p><p class="time" id="time"></p></header>
    <section><div><p class="chapter" id="chapter"></p><h1 id="title"></h1><p class="lead" id="lead"></p><div class="notes" id="notes"></div></div><pre class="diagram" id="diagram"></pre></section>
    <footer><div class="track"><span id="progress"></span></div><div class="caption" id="caption"></div></footer>
  </main>
  <script>
    const scenes = [
      { title:'Think of the limiter as a gatekeeper', lead:'Before a request enters the application, a gatekeeper asks one simple question: "Does this client still have permission to enter?" It lets normal traffic pass and blocks a client that is sending too many requests.', notes:['A client can be one user, one API key, or one IP address.','The gatekeeper protects costly services such as payment and search.','A blocked request gets HTTP 429: "please try again later".'], diagram:'CLIENT\n  |  request\n  v\n+-------------------+       allowed       +----------------+\n| RATE-LIMIT GUARD  | ------------------> | BACKEND SERVICE|\n+-------------------+                     +----------------+\n  |\n  +--- no permission ---> HTTP 429\n\nGoal: protect the backend before work starts.', caption:'1. The simple problem' },
      { title:'Token Bucket means entry tickets', lead:'Imagine each client owns a bucket of entry tickets. One request uses one ticket. When tickets finish, the next request waits or receives HTTP 429. New tickets slowly return to the bucket over time.', notes:['Bucket capacity is the maximum number of saved tickets.','Refill rate is how fast new tickets come back.','This allows a small burst but prevents endless high traffic.'], diagram:'TOKEN BUCKET = TICKETS\n\n  full bucket                 burst of requests\n  [ T T T T T T ]  ------->   [ empty ]\n       6 tickets                no ticket = 429\n\n  time passes\n  [ empty ]  ---- refill ----> [ T T ]\n\ncapacity = maximum burst\nrefill rate = normal speed', caption:'2. Token Bucket visual' },
      { title:'Place enforcement at the API Gateway', lead:'The gateway is the natural enforcement point because every external request passes through it before it consumes backend capacity.', notes:['Authenticate and identify the request subject.','Apply rate limit before routing to application services.','Keep gateways stateless so they can scale horizontally.'], diagram:'Client\n  |\n  v\nLoad Balancer\n  |\n  +----> API Gateway Cluster ----> Backend Services\n             |\n             +---- rate-limit check', caption:'3. Enforcement location' },
      { title:'HLD: The big picture', lead:'HLD means High-Level Design. It answers: "Which big parts exist, and how do they talk?" Here, gateways act as gatekeepers, Redis is their shared fast notebook, and Postgres stores the permanent rules.', notes:['The load balancer sends a request to any available gateway.','Every gateway reads the same shared Redis data.','Postgres is slower but safely stores the original policy rules.'], diagram:'                         +---------------------------+\n                         | REDIS: shared fast notebook|\n                         | tickets + cached rules     |\n                         +-------------^-------------+\n                                       |\nClient -> Load Balancer -> Gateway group -> Backend Services\n                            |       |       |\n                         Guard 1  Guard 2  Guard 3\n                                       |\n                           missing rule?  v\n                         +---------------------------+\n                         | POSTGRES: permanent rules  |\n                         +---------------------------+', caption:'4. HLD big-picture diagram' },
      { title:'Share state across all gateway instances', lead:'Local counters are not enough. A client could spread requests across gateway instances and multiply its effective quota. All gateways therefore read and update shared Redis state.', notes:['Any gateway can serve any request.','The quota remains the same regardless of selected gateway.','Redis keeps mutable token state outside application processes.'], diagram:'                 +------------------+\n                 |  Redis Cluster   |\n                 | shared token     |\n                 | state            |\n                 +--------^---------+\n                          |\n Gateway 1  -----+--------+--------+-----  Gateway 2\n Gateway 3  -----+                 +-----  Gateway N', caption:'4. Shared distributed state' },
      { title:'Shard Redis by the rate-limit key', lead:'Consistent hashing routes all updates for one subject to the same Redis shard. This keeps each subject bucket local to one Redis node and avoids cross-shard coordination.', notes:['rate_limit:user123:/api/orders always maps to one shard.','A single Redis shard can apply an atomic Lua operation.','Adding a shard moves only a subset of keys.'], diagram:'hash(subject ID)\n       |\n       +--> Shard 1: users A-F\n       +--> Shard 2: users G-N\n       +--> Shard 3: users O-Z\n\nuser123 + /api/orders\n       |\n       +--> same shard for every request', caption:'5. Redis cluster and sharding' },
      { title:'Make refill and deduction atomic', lead:'The critical operation reads tokens, calculates refill, deducts a token when available, and writes the new state. It must run as one Redis Lua EVAL call.', notes:['Never use separate GET then DECR commands.','Lua prevents two gateways from both spending the last token.','One atomic result: allow or deny.'], diagram:'Gateway 1: EVAL [ read -> refill -> deduct -> write ] -> allow\nGateway 2: EVAL [ waits in Redis queue ]\n                     |\n                     v\n              sees updated token count\n              -> deny when empty\n\nNo distributed lock. No race window.', caption:'7. Atomic Lua execution' },
      { title:'LLD: The code-level picture', lead:'LLD means Low-Level Design. It answers: "Which classes and methods will we write?" The gateway asks one common interface, isAllowed. Different algorithms can plug in behind that interface.', notes:['Strategy is a common shape: each limiter has isAllowed(subject).','The factory reads configuration and picks the right limiter.','Token Bucket sends its shared-state update to Redis.'], diagram:'                  RateLimiterStrategy\n                  + isAllowed(subject)\n                           ^\n          +----------------+----------------+\n          |                |                |\n TokenBucketLimiter  FixedWindowLimiter  LeakyBucketLimiter\n\n RateLimiterFactory --> picks one strategy from config\n API Gateway ---------> strategy.isAllowed()\n TokenBucketLimiter --> Redis Lua script\n PolicyRepository ---> Redis cache / Postgres', caption:'8. LLD class diagram' },
      { title:'Separate policy data from token state', lead:'Policies change rarely, but token state changes with every request. Store the durable rules in Postgres and cache policy data in Redis so the hot path avoids database reads.', notes:['Policy: capacity, refill rate, algorithm, endpoint, tier.','Token state: current tokens and last refill timestamp.','TTL removes inactive token buckets automatically.'], diagram:'POSTGRES                         REDIS\nrate_limit_rules                 policy:user123:/orders\n  capacity=100          -->      capacity=100, refill=10\n  refill_rate=10                 TTL=3600\n\n                                 rate_limit:user123:/orders\n                                 tokens=95, last_refill=ts', caption:'9. Policy and token data' },
      { title:'Follow the request decision flow', lead:'On a normal request, the gateway extracts identity, loads policy from Redis, calls the Lua script, then either forwards the request or stops immediately with HTTP 429.', notes:['Policy cache miss reads Postgres once, then writes Redis.','Allowed response includes remaining quota headers.','Denied requests never reach the backend.'], diagram:'1. Parse JWT -> subject=user123\n2. GET policy:user123:/orders\n3. EVAL token bucket script\n\nreturn 1 -> forward to Order Service\n            X-RateLimit-Remaining: 99\n\nreturn 0 -> HTTP 429\n            Retry-After: 1', caption:'10. Request flow' },
      { title:'Handle policy updates and Redis failures', lead:'An admin update writes Postgres first, then writes through to Redis and publishes an invalidation event. A circuit breaker prevents an unhealthy Redis cluster from cascading latency into every request.', notes:['Pub/Sub makes rule updates visible to gateways quickly.','Typical public API default: fail open during a short Redis outage.','Compliance-sensitive endpoints may deliberately fail closed.'], diagram:'POLICY UPDATE\nAdmin -> Postgres -> Redis cache -> Pub/Sub -> Gateways\n\nREDIS FAILURE\n10 timeouts -> Circuit OPEN for 30 seconds\n             -> fail open, alert, then half-open test\n\nException: financial/compliance flow -> fail closed', caption:'11. Updates and resilience' },
      { title:'Scale and observe the system', lead:'At high traffic, scale gateways and Redis independently. Track whether the limiter is protecting the system without mistakenly rejecting legitimate users.', notes:['Scale gateways because they are stateless.','Scale Redis shards according to EVAL throughput and hot-key distribution.','Alert on high 429 rate, Redis p99 latency, and low policy-cache hit rate.'], diagram:'Client -> Load Balancer -> Stateless Gateways -> Redis Cluster\n                                      |                 |\n                                      v                 v\n                              Backend Services    Policy Cache\n\nKey outcome:\nFast, atomic, burst-friendly distributed enforcement.', caption:'12. Production summary' }
    ];
    const duration = 180, requested = new URLSearchParams(location.search).get('time'), fixed = requested === null ? null : Math.max(0, Math.min(duration - .01, Number(requested)));
    const $ = id => document.getElementById(id);
    function render(time) { const index = Math.min(scenes.length - 1, Math.floor(time / 15)); const scene = scenes[index]; $('time').textContent = `00:${String(Math.floor(time)).padStart(2,'0')} / 03:00`; $('chapter').textContent = `Architecture chapter ${index + 1} of ${scenes.length}`; $('title').textContent = scene.title; $('lead').textContent = scene.lead; $('notes').innerHTML = scene.notes.map(note => `<div class="note">${note}</div>`).join(''); $('diagram').textContent = scene.diagram; $('caption').textContent = scene.caption; $('progress').style.width = `${time / duration * 100}%`; }
    const started = performance.now(); function frame(now) { render(fixed === null ? (now - started) / 1000 % duration : fixed); if (fixed === null) requestAnimationFrame(frame); } requestAnimationFrame(frame);
  </script>
</body>
</html>
